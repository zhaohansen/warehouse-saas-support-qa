# 该文件用于: 管理整个项目的配置.
# 包含数据库、缓存、向量库、模型、检索与应用六类配置.

# MySQL 配置
[mysql]
host = localhost
user = root
password = 你的数据库密码
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
password =
db = 0

# 日志配置
[logger]
log_file = logs/app.log


# Milvus 配置
[milvus]
host = localhost
port = 19530
database = itcast
collection = edurag_v1

# Embedding 模型配置
[embedding]
model_path = ./models/bge-m3
device = cuda
# 半精度只在编码阶段生效, 入库与检索前会统一转成 float32,
# 与集合里 dense_vector 的 FLOAT_VECTOR 字段保持一致
use_fp16 = true

# Reranker 模型配置
[reranker]
model_path = ./models/bge-reranker-large
device = cuda

# 文档处理配置
[document]
data_dir = ./rag_qa/data
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
batch_size = 32

[retrieval]
retrieval_k = 3
# 先充分召回候选，再重排选取少量上下文
recall_candidates = 20
candidate_m = 2
dense_weight = 0.7
sparse_weight = 1.0
nprobe = 10
min_score = 0.25

# 大模型配置(阿里云百炼 DashScope 的 OpenAI 兼容接口)
# api_key 也可以不改这里, 改用环境变量 DASHSCOPE_API_KEY 传入.
[llm]
# api_key 通过环境变量 DASHSCOPE_API_KEY 提供，不要把密钥写进本文件
# 注意：这一行必须保持注释状态。若取消注释（哪怕留空值），
# configparser 会返回该选项的值，环境变量就永远读不到。
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-plus

# 应用配置
[app]
# RAG 扫描的学科数据目录, 多个用英文逗号分隔, 对应 rag_qa/data 下的 xxx_data 目录
valid_sources = python,java,ai,mysql,redis
faq_threshold = 0.85
customer_service_phone =
