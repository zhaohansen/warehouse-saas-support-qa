# 该文件用于: 管理整个项目的配置.
# 包含数据库、缓存、向量库、模型、检索与应用六类配置.

# MySQL 配置
[mysql]
host = localhost
user = root
password = 你的数据库密码
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
password =
db = 0

# 日志配置
[logger]
log_file = logs/app.log


# Milvus 配置
[milvus]
host = localhost
port = 19530
database = enterprise_knowledge
collection = enterprise_knowledge_qa

# Embedding 模型配置
[embedding]
model_path = ./rag_qa/models/bge-m3
device = cuda
# 半精度只在编码阶段生效, 入库与检索前会统一转成 float32,
# 与集合里 dense_vector 的 FLOAT_VECTOR 字段保持一致
use_fp16 = true

# Reranker 模型配置
[reranker]
model_path = ./rag_qa/models/bge-reranker-large
device = cuda

# 文档处理配置
[document]
data_dir = ./rag_qa/data
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
batch_size = 32

[retrieval]
retrieval_k = 3
# 先充分召回候选，再重排选取少量上下文
recall_candidates = 20
candidate_m = 2
dense_weight = 0.7
sparse_weight = 1.0
nprobe = 10
min_score = 0.25
# 重排分数低于该值时按“资料不足”处理，避免用无关资料作答
min_answer_score = 0.35


[llm]
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-plus


[app]
valid_sources = policies,products,operations,onboarding
faq_threshold = 0.85
