<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>知序 · 学科知识助手</title>
    <script>try {
        document.documentElement.dataset.theme = localStorage.getItem('qa_theme') || 'light'
    } catch (e) {
    }</script>
    <style>
        :root {
            --bg: #fbfbfd;
            --panel: #fff;
            --side: #f1f2f7;
            --ink: #202135;
            --muted: #77798d;
            --line: #e5e6ee;
            --accent: #6554d8;
            --soft: #edeafc;
            --warn: #956020;
            --warnbg: #fff6e7;
            --green: #25816b;
            color-scheme: light
        }

        :root[data-theme=dark] {
            --bg: #171822;
            --panel: #20212e;
            --side: #13141d;
            --ink: #eeeef6;
            --muted: #a3a5bb;
            --line: #343548;
            --accent: #b2a5ff;
            --soft: #302b4e;
            --warn: #e4ba72;
            --warnbg: #342c20;
            --green: #78c9ad;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--ink)
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer;
            border: 0;
            background: none
        }

        button:disabled {
            opacity: .5;
            cursor: wait
        }

        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px
        }

        h1, h2, h3, p {
            margin: 0
        }

        [hidden] {
            display: none !important
        }

        .shell {
            height: 100dvh;
            display: grid;
            grid-template-columns:248px minmax(0, 1fr)
        }

        .sidebar {
            background: var(--side);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 25px 16px 15px;
            min-height: 0;
            z-index: 30
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 10px 25px
        }

        .brandmark {
            background: var(--ink);
            color: var(--panel);
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            font-size: 21px;
            font-weight: 600
        }

        .brandname {
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: 650
        }

        .brand small {
            display: block;
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--muted)
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            white-space: nowrap
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent)
        }

        .newchat {
            width: 100%;
            justify-content: flex-start
        }

        .newchat span {
            margin-left: auto;
            color: var(--muted);
            font-size: 10px
        }

        .search {
            margin: 23px 0 18px
        }

        .search input {
            width: 100%;
            border: 0;
            background: transparent;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px
        }

        .listhead {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 11px;
            padding: 0 10px 9px
        }

        .sessions {
            flex: 1;
            overflow: auto;
            min-height: 0
        }

        .session {
            display: flex;
            align-items: center;
            gap: 4px;
            border-radius: 9px;
            margin: 3px 0
        }

        .session.active, .session:hover {
            background: var(--panel)
        }

        .session-open {
            min-width: 0;
            flex: 1;
            text-align: left;
            padding: 11px 10px;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .session-delete {
            padding: 8px;
            color: var(--muted);
            opacity: 0
        }

        .session:hover .session-delete, .session:focus-within .session-delete {
            opacity: 1
        }

        .empty {
            padding: 24px 12px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            white-space: pre-wrap
        }

        .sidefoot {
            border-top: 1px solid var(--line);
            padding-top: 15px;
            margin-top: 12px
        }

        .library-btn {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 10px;
            text-align: left
        }

        .count {
            margin-left: auto;
            background: var(--panel);
            padding: 0 7px;
            border-radius: 5px;
            font-size: 11px
        }

        .account {
            padding: 18px 10px 0;
            color: var(--muted);
            font-size: 11px
        }

        .workspace {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column
        }

        .topbar {
            height: 78px;
            padding: 0 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            flex: none
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 13px;
            font-size: 12px;
            color: var(--muted)
        }

        .breadcrumb strong {
            font-weight: 500;
            color: var(--ink)
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .health {
            color: var(--muted);
            font-size: 11px;
            margin-right: 8px
        }

        .health.ready {
            color: var(--green)
        }

        .iconbtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            border-radius: 9px;
            color: var(--muted)
        }

        .iconbtn:hover {
            background: var(--soft);
            color: var(--accent)
        }

        .mobile-menu {
            display: none
        }

        .chat-head {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 30px 0;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .subject-select {
            font-size: 12px;
            color: var(--muted)
        }

        select {
            border: 0;
            background: transparent;
            padding: 6px;
            color: var(--ink)
        }

        .chat-actions {
            display: flex;
            gap: 5px
        }

        .chat-log {
            flex: 1;
            min-height: 0;
            overflow: auto;
            scroll-behavior: smooth
        }

        .content-width {
            max-width: 920px;
            margin: 0 auto;
            padding: 0 32px
        }

        .welcome {
            padding-top: clamp(35px, 9vh, 90px);
            padding-bottom: 30px
        }

        .eyebrow {
            color: var(--accent);
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 19px
        }

        .welcome h1 {
            font-size: clamp(30px, 3.7vw, 45px);
            font-weight: 600;
            line-height: 1.45;
            letter-spacing: -1px
        }

        .welcome h1 em {
            font-style: normal;
            color: var(--accent)
        }

        .intro {
            color: var(--muted);
            font-size: 13px;
            margin-top: 15px;
            max-width: 540px;
            line-height: 1.9
        }

        .subject-pills {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 24px
        }

        .pill {
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 4px 11px;
            font-size: 11px;
            background: var(--panel);
            color: var(--muted)
        }

        .pill.active {
            color: var(--accent);
            background: var(--soft);
            border-color: var(--soft)
        }

        .suggestion-label {
            color: var(--muted);
            font-size: 11px;
            margin: 33px 0 12px
        }

        .suggestions {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 11px
        }

        .suggestion {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: left;
            padding: 17px 18px;
            display: flex;
            align-items: flex-start;
            gap: 13px;
            transition: transform .15s, border-color .15s
        }

        .suggestion:hover {
            transform: translateY(-2px);
            border-color: var(--accent)
        }

        .suggestion-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--soft);
            color: var(--accent);
            display: grid;
            place-items: center;
            flex: none;
            font-size: 12px
        }

        .suggestion p {
            font-size: 12px;
            line-height: 1.75
        }

        .suggestion small {
            display: block;
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px
        }

        .welcome-note {
            margin-top: 24px;
            font-size: 11px;
            color: var(--muted)
        }

        .messages {
            padding: 25px 0 28px;
            display: flex;
            flex-direction: column;
            gap: 28px
        }

        .message {
            display: flex;
            gap: 13px;
            align-items: flex-start
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            flex: none;
            font-size: 11px;
            background: var(--soft);
            color: var(--accent);
            font-weight: 600
        }

        .message.user {
            justify-content: flex-end
        }

        .message.user .message-body {
            background: var(--soft);
            border-radius: 16px 16px 3px 16px;
            padding: 12px 17px;
            max-width: 83%;
            flex: none
        }

        .message-body {
            min-width: 0;
            flex: 1
        }

        .message-label {
            font-size: 11px;
            margin: 2px 0 11px
        }

        .prose {
            font-size: 14px;
            line-height: 1.95;
            overflow-wrap: anywhere
        }

        .prose .plain {
            white-space: pre-wrap
        }

        .prose code {
            background: var(--soft);
            color: var(--accent);
            border-radius: 4px;
            padding: 2px 5px;
            font: 12px/1.6 Consolas, monospace
        }

        .codeblock {
            margin: 12px 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background: var(--panel)
        }

        .codebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--side);
            padding: 6px 12px;
            color: var(--muted);
            font: 11px Consolas, monospace
        }

        .codebar button {
            font-size: 11px;
            padding: 3px 5px
        }

        .codeblock pre {
            margin: 0;
            padding: 14px;
            overflow: auto;
            white-space: pre;
            font: 12px/1.8 Consolas, monospace
        }

        .codeblock pre code {
            background: transparent;
            color: var(--ink);
            padding: 0
        }

        .answer-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 10px;
            margin-top: 12px
        }

        .references {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 13px
        }

        .reference {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 10px;
            color: var(--muted);
            max-width: 100%;
            overflow-wrap: anywhere
        }

        .thinking {
            color: var(--muted);
            font-size: 12px
        }

        .answer-error {
            color: var(--warn);
            font-size: 12px;
            padding: 8px 0
        }

        .composer {
            padding: 14px 32px 20px;
            flex: none;
            background: var(--bg)
        }

        .composer-wrap {
            max-width: 856px;
            margin: auto
        }

        .inputbox {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 17px;
            box-shadow: 0 5px 25px #29253a06;
            padding: 13px 13px 11px 17px
        }

        .inputbox:focus-within {
            border-color: var(--accent)
        }

        .inputbox textarea {
            width: 100%;
            border: 0;
            outline: none !important;
            resize: none;
            background: transparent;
            font-size: 13px;
            min-height: 43px;
            max-height: 180px;
            padding: 0;
            line-height: 1.8
        }

        .inputbox textarea::placeholder {
            color: var(--muted)
        }

        .input-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .input-hint {
            color: var(--muted);
            font-size: 10px
        }

        .send {
            background: var(--ink);
            color: var(--panel);
            border-radius: 9px;
            min-width: 60px;
            height: 34px;
            padding: 0 12px;
            font-size: 12px
        }

        .send.generating {
            background: var(--soft);
            color: var(--accent)
        }

        .disclaimer {
            text-align: center;
            font-size: 10px;
            color: var(--muted);
            margin-top: 10px
        }

        .dialog {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 18px;
            padding: 26px;
            width: min(620px, calc(100vw - 28px));
            max-height: 85dvh;
            box-shadow: 0 18px 70px #23204025
        }

        .dialog::backdrop {
            background: #15142466;
            backdrop-filter: blur(3px)
        }

        .dialog-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 6px
        }

        .dialog h2 {
            font-size: 20px;
            font-weight: 600
        }

        .dialog-intro {
            color: var(--muted);
            font-size: 12px;
            margin: 8px 0 23px
        }

        .field-label {
            display: block;
            font-size: 12px;
            margin: 18px 0 7px
        }

        .field {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 10px;
            background: var(--bg)
        }

        .droparea {
            border: 1px dashed var(--line);
            border-radius: 12px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 15px;
            cursor: pointer;
            margin-top: 17px;
            gap: 7px;
            width: 100%
        }

        .droparea.over {
            border-color: var(--accent);
            background: var(--soft)
        }

        .droparea strong {
            font-size: 13px;
            font-weight: 500;
            overflow-wrap: anywhere;
            max-width: 100%
        }

        .droparea small {
            font-size: 11px;
            color: var(--muted)
        }

        .dialog-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 22px
        }

        .statusbox {
            font-size: 12px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: var(--soft);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px
        }

        .statusbox.warning {
            background: var(--warnbg);
            color: var(--warn)
        }

        .doc-list {
            max-height: 330px;
            overflow: auto;
            margin-top: 20px
        }

        .doc-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 13px 0;
            border-bottom: 1px solid var(--line)
        }

        .doc-icon {
            background: var(--soft);
            color: var(--accent);
            border-radius: 8px;
            padding: 8px;
            font-size: 10px;
            flex: none
        }

        .doc-main {
            min-width: 0;
            flex: 1
        }

        .doc-name {
            font-size: 12px;
            font-weight: 500;
            overflow-wrap: anywhere
        }

        .doc-meta {
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px
        }

        .doc-warning {
            font-size: 10px;
            color: var(--warn);
            margin-top: 5px
        }

        .tabs {
            display: flex;
            gap: 17px;
            border-bottom: 1px solid var(--line);
            margin-top: 15px
        }

        .tab {
            padding: 9px 1px;
            font-size: 12px;
            color: var(--muted);
            border-bottom: 2px solid transparent
        }

        .tab.active {
            border-color: var(--accent);
            color: var(--accent)
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - 30px);
            padding: 11px 18px;
            border-radius: 10px;
            background: var(--ink);
            color: var(--panel);
            font-size: 12px;
            z-index: 100;
            overflow-wrap: anywhere
        }

        .mask {
            display: none
        }

        @media (max-width: 1000px) {
            .shell {
                grid-template-columns:220px minmax(0, 1fr)
            }

            .topbar {
                padding: 0 24px
            }

            .health {
                display: none
            }

            .toolbar .btn {
                font-size: 12px
            }

            .content-width {
                padding: 0 25px
            }

            .welcome h1 {
                font-size: 35px
            }

            .suggestion {
                padding: 14px
            }

            .suggestion-icon {
                display: none
            }
        }

        @media (max-width: 720px) {
            .shell {
                display: block
            }

            .sidebar {
                position: fixed;
                inset: 0 auto 0 0;
                width: 270px;
                transform: translateX(-100%);
                transition: transform .2s
            }

            .sidebar.open {
                transform: translateX(0)
            }

            .mask.open {
                display: block;
                position: fixed;
                inset: 0;
                background: #1115;
                z-index: 25
            }

            .workspace {
                height: 100dvh
            }

            .mobile-menu {
                display: inline-flex
            }

            .topbar {
                height: 63px;
                padding: 0 15px
            }

            .breadcrumb {
                gap: 8px
            }

            .breadcrumb .workspace-label, .breadcrumb .slash {
                display: none
            }

            .toolbar {
                gap: 5px
            }

            .toolbar .btn {
                padding: 7px 10px;
                font-size: 11px
            }

            .chat-head {
                padding: 13px 18px 0
            }

            .content-width {
                padding: 0 20px
            }

            .welcome {
                padding-top: 34px
            }

            .welcome h1 {
                font-size: 32px
            }

            .intro {
                font-size: 12px
            }

            .suggestion-label {
                margin-top: 27px
            }

            .suggestions {
                gap: 8px
            }

            .suggestion {
                padding: 12px
            }

            .suggestion p {
                font-size: 12px
            }

            .suggestion small {
                font-size: 10px
            }

            .welcome-note {
                font-size: 10px
            }

            .composer {
                padding: 10px 14px max(12px, env(safe-area-inset-bottom))
            }

            .disclaimer {
                font-size: 9px
            }

            .message {
                gap: 9px
            }

            .avatar {
                width: 26px;
                height: 26px;
                font-size: 10px
            }

            .prose {
                font-size: 13px
            }

            .dialog {
                padding: 20px
            }

            .session-delete {
                opacity: 1
            }

            .inputbox textarea {
                font-size: 16px
            }

            .enter-hint {
                display: none
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
                transition: none !important
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="会话与资料">
        <div class="brand">
            <div class="brandmark">知</div>
            <div>
                <div class="brandname">知序</div>
                <small>KNOWLEDGE STUDIO</small></div>
        </div>
        <button class="btn newchat" id="btn-new">＋ 开启新对话<span>NEW</span></button>
        <div class="search"><input id="session-search" aria-label="搜索会话" placeholder="搜索你的对话…"></div>
        <div class="listhead"><span>最近对话</span><span id="session-count">0</span></div>
        <div class="sessions" id="session-list"></div>
        <div class="sidefoot">
            <button class="library-btn" id="btn-library">▤ 我的资料库<span class="count" id="document-count">0</span>
            </button>
            <div class="account">个人学习空间<br>让每次探索都有迹可循</div>
        </div>
    </aside>
    <div class="mask" id="mask"></div>
    <main class="workspace">
        <header class="topbar">
            <div class="breadcrumb">
                <button class="iconbtn mobile-menu" id="btn-menu" aria-label="打开会话列表" aria-expanded="false">☰
                </button>
                <span class="workspace-label">我的工作空间</span><span class="slash">/</span><strong>学科问答</strong>
            </div>
            <div class="toolbar"><span class="health" id="health">正在连接</span>
                <button class="iconbtn" id="btn-theme" aria-label="切换明暗主题">◐</button>
                <button class="btn" id="btn-import">↥ 导入资料</button>
            </div>
        </header>
        <div class="chat-head"><label class="subject-select">检索范围 <select id="filter" aria-label="限定问答学科">
            <option value="">全部学科</option>
        </select></label>
            <div class="chat-actions">
                <button class="iconbtn" id="btn-export" title="导出对话" aria-label="导出当前对话">↧</button>
                <button class="iconbtn" id="btn-clear" title="删除当前对话" aria-label="删除当前对话">⌫</button>
            </div>
        </div>
        <div class="chat-log" id="chat-log" role="log" aria-label="对话记录" aria-live="polite">
            <div class="content-width">
                <section class="welcome" id="welcome">
                    <div class="eyebrow">A LITTLE CURIOSITY GOES A LONG WAY</div>
                    <h1>从一个问题，<br>打开一整个<em>知识库。</em></h1>
                    <p class="intro">
                        把课程、笔记和学习资料放在一起。带着你的问题来，让复杂的概念变得清晰，让零散的知识彼此连接。</p>
                    <div class="subject-pills" id="subject-pills"></div>
                    <div class="suggestion-label">不知道从哪里开始？试试这些问题</div>
                    <div class="suggestions" id="suggestions"></div>
                    <div class="welcome-note">结合你的资料回答，保留每一段对话。</div>
                </section>
                <div class="messages" id="messages" hidden></div>
            </div>
        </div>
        <footer class="composer">
            <div class="composer-wrap">
                <div class="inputbox"><textarea id="input" rows="2" placeholder="有什么想弄明白的？在这里问问…"
                                                aria-label="输入问题" maxlength="6000"></textarea>
                    <div class="input-tools">
                        <button class="input-hint" id="btn-attach">＋ 添加学习资料<span
                                class="enter-hint"> · Enter 发送</span></button>
                        <button class="send" id="btn-send" aria-label="发送问题">发送 ↗</button>
                    </div>
                </div>
                <p class="disclaimer">AI 回答可能存在偏差，请结合引用资料核实重要信息。</p></div>
        </footer>
    </main>
</div>
<dialog class="dialog" id="library-dialog" aria-labelledby="library-title">
    <div class="dialog-head"><h2 id="library-title">我的资料库</h2>
        <button class="iconbtn" id="close-library" aria-label="关闭资料库">✕</button>
    </div>
    <p class="dialog-intro">将学习资料加入知识库，之后就可以围绕它们提问。</p>
    <div class="tabs" role="tablist" aria-label="资料操作">
        <button class="tab active" id="tab-upload" role="tab" aria-selected="true" aria-controls="upload-panel">
            导入新资料
        </button>
        <button class="tab" id="tab-documents" role="tab" aria-selected="false" aria-controls="documents-panel">
            已导入资料
        </button>
    </div>
    <section id="upload-panel" role="tabpanel" aria-labelledby="tab-upload"><label class="field-label"
                                                                                   for="upload-source">资料所属学科</label><select
            class="field" id="upload-source"></select><input id="document-file" type="file" accept=".pdf,.pptx,.txt"
                                                             hidden>
        <button class="droparea" id="droparea"><strong id="selected-file">点击选择，或将文件拖到这里</strong><small>PDF、PPTX、TXT
            · 每份不超过 20 MB</small></button>
        <div class="statusbox" id="import-status" role="status" hidden></div>
        <div class="dialog-foot">
            <button class="btn primary" id="btn-upload" disabled>加入知识库 →</button>
        </div>
    </section>
    <section id="documents-panel" role="tabpanel" aria-labelledby="tab-documents" hidden>
        <div class="doc-list" id="document-list"></div>
    </section>
</dialog>
<dialog class="dialog" id="login-dialog" aria-labelledby="login-title"><h2 id="login-title">进入学习空间</h2>
    <p class="dialog-intro">此空间已启用访问保护，请输入管理员设置的访问口令。</p>
    <form id="login-form"><label class="field-label" for="access-token">访问口令</label><input class="field"
                                                                                               id="access-token"
                                                                                               type="password"
                                                                                               autocomplete="current-password"
                                                                                               required>
        <p id="login-error" class="answer-error" role="alert"></p>
        <div class="dialog-foot">
            <button class="btn primary" type="submit">进入空间</button>
        </div>
    </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
    (function () {
        'use strict';
        const $ = id => document.getElementById(id),
            names = {python: 'Python', java: 'Java', ai: 'AI', mysql: 'MySQL', redis: 'Redis'};
        const state = {
            sid: null,
            sessions: [],
            messages: [],
            documents: [],
            sources: [],
            busy: false,
            ws: null,
            epoch: 0,
            uploading: false,
            file: null,
            stick: true,
            historyRequest: 0
        };
        let toastTimer;

        function node(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e
        }

        function toast(text) {
            $('toast').textContent = text;
            $('toast').hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $('toast').hidden = true, 4000)
        }

        async function api(path, options) {
            const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
            let response;
            try {
                response = await fetch(path, {...options, signal: controller.signal})
            } finally {
                clearTimeout(timer)
            }
            let data;
            try {
                data = await response.json()
            } catch (e) {
                throw new Error('服务返回异常，请稍后重试')
            }
            if (response.status === 401) {
                if (!$('login-dialog').open) $('login-dialog').showModal();
                throw new Error('请先输入正确的访问口令')
            }
            if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '操作失败，请重试');
            return data
        }

        function saveSid(sid) {
            state.sid = sid;
            try {
                localStorage.setItem('qa_session_id', sid)
            } catch (e) {
            }
        }

        function scroll(force) {
            if (force || state.stick) $('chat-log').scrollTop = $('chat-log').scrollHeight
        }

        function showChat() {
            const has = state.messages.length > 0;
            $('welcome').hidden = has;
            $('messages').hidden = !has
        }

        function setBusy(value) {
            state.busy = value;
            $('btn-send').classList.toggle('generating', value);
            $('btn-send').textContent = value ? '■ 停止' : '发送 ↗';
            $('btn-send').setAttribute('aria-label', value ? '停止生成' : '发送问题')
        }

        function closeSidebar() {
            $('sidebar').classList.remove('open');
            $('mask').classList.remove('open');
            $('btn-menu').setAttribute('aria-expanded', 'false')
        }

        function stop() {
            if (state.ws) {
                state.ws.onclose = null;
                state.ws.close();
                state.ws = null
            }
            const msg = state.messages[state.messages.length - 1];
            if (state.busy && msg && msg.role === 'assistant') {
                msg.status = '已停止生成';
                renderMessage(msg)
            }
            state.epoch++;
            setBusy(false)
        }

        function inline(parent, text) {
            const regex = /(\*\*([^*]+)\*\*|`([^`]+)`)/g;
            let cursor = 0, match;
            while ((match = regex.exec(text))) {
                parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
                parent.appendChild(node(match[2] ? 'strong' : 'code', '', match[2] || match[3]));
                cursor = regex.lastIndex
            }
            parent.appendChild(document.createTextNode(text.slice(cursor)))
        }

        function prose(element, text) {
            element.replaceChildren();
            const regex = /```([^\n`]*)\n([\s\S]*?)(?:```|$)/g;
            let cursor = 0, match;

            function plain(value) {
                const block = node('div', 'plain');
                inline(block, value);
                element.appendChild(block)
            }

            while ((match = regex.exec(text))) {
                plain(text.slice(cursor, match.index));
                const block = node('div', 'codeblock'), bar = node('div', 'codebar'),
                    copy = node('button', '', '复制代码');
                copy.type = 'button';
                const code = match[2];
                copy.onclick = () => copyText(code);
                bar.append(node('span', '', match[1].trim() || 'code'), copy);
                const pre = node('pre');
                pre.append(node('code', '', code));
                block.append(bar, pre);
                element.append(block);
                cursor = regex.lastIndex
            }
            plain(text.slice(cursor))
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                toast('已复制')
            } catch (e) {
                toast('复制失败，请手动选择文字复制')
            }
        }

        function renderMessage(msg) {
            if (!msg.element) {
                const row = node('article', 'message ' + msg.role);
                if (msg.role === 'assistant') row.append(node('div', 'avatar', '知'));
                const body = node('div', 'message-body');
                if (msg.role === 'assistant') body.append(node('div', 'message-label', '知序 · 知识助手'));
                msg.prose = node('div', 'prose');
                body.append(msg.prose);
                msg.extra = node('div');
                body.append(msg.extra);
                row.append(body);
                $('messages').append(row);
                msg.element = row
            }
            if (msg.role === 'user') {
                msg.prose.textContent = msg.text;
                msg.prose.style.whiteSpace = 'pre-wrap';
                return
            }
            if (!msg.text && msg.status === '正在思考') {
                msg.prose.replaceChildren(node('div', 'thinking', '正在检索资料，整理答案…'))
            } else prose(msg.prose, msg.text);
            msg.extra.replaceChildren();
            if (msg.error) msg.extra.append(node('div', 'answer-error', msg.error));
            if (msg.sources && msg.sources.length) {
                const refs = node('div', 'references');
                for (const item of msg.sources) {
                    const location = item.page ? ' · 第 ' + item.page + ' 页' : item.slide ? ' · 第 ' + item.slide + ' 张' : '';
                    refs.append(node('span', 'reference', '[' + item.index + '] ' + item.title + location))
                }
                msg.extra.append(refs)
            }
            const foot = node('div', 'answer-foot'), copy = node('button', 'iconbtn', '复制');
            copy.type = 'button';
            copy.setAttribute('aria-label', '复制回答');
            copy.onclick = () => copyText(msg.text);
            foot.append(copy, node('span', '', msg.status === '正在思考' ? (msg.text ? '正在生成…' : '检索中…') : msg.status || '已完成'));
            msg.extra.append(foot)
        }

        function addMessage(role, text) {
            const msg = {role, text, status: role === 'assistant' ? '正在思考' : '', sources: []};
            state.messages.push(msg);
            showChat();
            renderMessage(msg);
            scroll(true);
            return msg
        }

        function resetMessages() {
            state.messages = [];
            $('messages').replaceChildren();
            showChat()
        }

        function renderSessions() {
            const filter = $('session-search').value.trim().toLowerCase(), list = $('session-list');
            list.replaceChildren();
            $('session-count').textContent = state.sessions.length;
            const rows = state.sessions.filter(s => s.title.toLowerCase().includes(filter));
            if (!rows.length) {
                list.append(node('p', 'empty', filter ? '没有找到相关对话' : '还没有对话记录\n从一个问题开始吧'));
                return
            }
            for (const s of rows) {
                const row = node('div', 'session' + (s.session_id === state.sid ? ' active' : '')),
                    open = node('button', 'session-open', '▱  ' + (s.title || '未命名对话')),
                    del = node('button', 'session-delete', '×');
                open.title = s.title;
                open.type = del.type = 'button';
                open.onclick = () => switchSession(s.session_id);
                del.setAttribute('aria-label', '删除会话：' + s.title);
                del.onclick = () => deleteSession(s.session_id);
                row.append(open, del);
                list.append(row)
            }
        }

        async function loadSessions() {
            try {
                state.sessions = (await api('/api/sessions?limit=200')).sessions || [];
                renderSessions()
            } catch (e) {
                toast(e.message)
            }
        }

        async function newSession() {
            stop();
            const request = ++state.historyRequest;
            try {
                const result = await api('/api/create_session', {method: 'POST'});
                if (request !== state.historyRequest) return;
                saveSid(result.session_id);
                resetMessages();
                renderSessions();
                closeSidebar();
                $('input').focus()
            } catch (e) {
                toast(e.message)
            }
        }

        async function switchSession(sid) {
            stop();
            const request = ++state.historyRequest;
            saveSid(sid);
            closeSidebar();
            resetMessages();
            renderSessions();
            try {
                const result = await api('/api/history/' + encodeURIComponent(sid) + '?limit=500');
                if (request !== state.historyRequest || state.sid !== sid) return;
                for (const item of result.history || []) {
                    addMessage('user', item.question);
                    const answer = addMessage('assistant', item.answer);
                    answer.status = '历史回答';
                    answer.sources = item.sources || [];
                    renderMessage(answer)
                }
                scroll(true)
            } catch (e) {
                if (request === state.historyRequest) toast(e.message)
            }
        }

        async function deleteSession(sid) {
            if (!confirm('删除这段对话？删除后无法恢复。')) return;
            if (state.sid === sid) stop();
            try {
                await api('/api/history/' + encodeURIComponent(sid), {method: 'DELETE'});
                if (state.sid === sid) await newSession();
                await loadSessions();
                toast('对话已删除')
            } catch (e) {
                toast(e.message)
            }
        }

        function renderPills() {
            const box = $('subject-pills');
            box.replaceChildren();
            for (const source of [''].concat(state.sources)) {
                const button = node('button', 'pill' + ($('filter').value === source ? ' active' : ''), source ? names[source] || source : '全部学科');
                button.type = 'button';
                button.onclick = () => {
                    $('filter').value = source;
                    renderPills()
                };
                box.append(button)
            }
        }

        function suggestions() {
            const rows = [['解释一下 Python 的生成器，举一个简单例子。', '从基础概念开始', '{ }'], ['MySQL 的索引为什么使用 B+ 树？', '理解背后的原理', 'DB'], ['缓存穿透、击穿和雪崩有什么区别？', '把相近概念分清楚', '↔'], ['用一个例子解释 RAG 是怎么工作的。', '让抽象知识具体起来', 'AI']];
            for (const [question, sub, mark] of rows) {
                const b = node('button', 'suggestion');
                b.type = 'button';
                const content = node('div');
                content.append(node('p', '', question), node('small', '', sub));
                b.append(node('span', 'suggestion-icon', mark), content);
                b.onclick = () => {
                    $('input').value = question;
                    send()
                };
                $('suggestions').append(b)
            }
        }

        async function send() {
            if (state.busy) {
                stop();
                return
            }
            const question = $('input').value.trim();
            if (!question) return;
            if (question.length > 6000) {
                toast('问题不能超过 6000 字');
                return
            }
            if (!state.sid) {
                toast('会话尚未就绪，请稍候重试');
                return
            }
            state.historyRequest++;
            const epoch = ++state.epoch, sid = state.sid, source = $('filter').value || null;
            addMessage('user', question);
            const answer = addMessage('assistant', '');
            $('input').value = '';
            $('input').style.height = 'auto';
            setBusy(true);
            let finished = false, frame = false;
            const socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/stream');
            state.ws = socket;

            function update() {
                if (!frame) {
                    frame = true;
                    requestAnimationFrame(() => {
                        frame = false;
                        if (epoch === state.epoch) {
                            renderMessage(answer);
                            scroll(false)
                        }
                    })
                }
            }

            function end(status, error) {
                if (epoch !== state.epoch) return;
                finished = true;
                answer.status = status;
                answer.error = error;
                renderMessage(answer);
                setBusy(false);
                state.ws = null;
                scroll(false)
            }

            socket.onopen = () => socket.send(JSON.stringify({
                query: question,
                source_filter: source,
                session_id: sid
            }));
            socket.onmessage = event => {
                if (epoch !== state.epoch) return;
                let data;
                try {
                    data = JSON.parse(event.data)
                } catch (e) {
                    end('生成失败', '服务返回格式异常');
                    socket.close();
                    return
                }
                if (data.type === 'start') {
                    if (data.session_id) saveSid(data.session_id)
                } else if (data.type === 'token') {
                    answer.text += data.token || '';
                    update()
                } else if (data.type === 'end') {
                    answer.sources = data.sources || [];
                    end('已完成 · ' + Number(data.processing_time || 0).toFixed(1) + ' 秒');
                    socket.close();
                    loadSessions()
                } else if (data.type === 'error') {
                    end('生成失败', data.error || '生成失败，请重试');
                    socket.close()
                }
            };
            socket.onerror = () => {
                if (!finished) end('连接失败', '无法连接问答服务，请确认服务正常，或刷新后重新验证访问口令。')
            };
            socket.onclose = () => {
                if (!finished && epoch === state.epoch) end('连接中断', '连接提前中断，当前回答可能不完整，请重试。')
            }
        }

        function tab(name) {
            const upload = name === 'upload';
            $('upload-panel').hidden = !upload;
            $('documents-panel').hidden = upload;
            for (const key of ['upload', 'documents']) {
                $('tab-' + key).classList.toggle('active', (key === 'upload') === upload);
                $('tab-' + key).setAttribute('aria-selected', String((key === 'upload') === upload))
            }
            if (!upload) loadDocuments()
        }

        function openLibrary(name = 'upload') {
            closeSidebar();
            if ($('filter').value) $('upload-source').value = $('filter').value;
            tab(name);
            $('library-dialog').showModal()
        }

        function selectFile(file) {
            if (state.uploading) return;
            state.file = null;
            $('import-status').hidden = true;
            if (!file) return;
            if (!/\.(pdf|pptx|txt)$/i.test(file.name) || !file.size || file.size > 20 * 1024 * 1024) {
                $('import-status').hidden = false;
                $('import-status').textContent = '请选择非空且不超过 20 MB 的 PDF、PPTX 或 TXT。旧版 PPT 请先另存为 PPTX。';
                $('btn-upload').disabled = true;
                return
            }
            state.file = file;
            $('selected-file').textContent = file.name;
            $('btn-upload').disabled = false
        }

        async function upload() {
            if (state.uploading || !state.file) return;
            const source = $('upload-source').value, file = state.file;
            if (!source) {
                toast('请先选择学科');
                return
            }
            state.uploading = true;
            $('btn-upload').disabled = true;
            $('btn-upload').textContent = '正在解析与入库…';
            $('import-status').hidden = false;
            $('import-status').classList.remove('warning');
            $('import-status').textContent = '正在处理 ' + file.name + '，扫描件识别可能需要较长时间。你可以关闭此窗口继续阅读。';
            try {
                const params = new URLSearchParams({source, filename: file.name});
                const response = await fetch('/api/documents?' + params, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/octet-stream'},
                    body: file
                });
                const result = await response.json();
                if (response.status === 401 && !$('login-dialog').open) $('login-dialog').showModal();
                if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : '导入失败');
                $('import-status').textContent = result.status === 'already_imported' ? '该文件已在此学科中，无需重复导入。' : '已加入 ' + (names[source] || source) + ' 知识库，共 ' + result.chunks + ' 个知识块。';
                if (result.warnings && result.warnings.length) {
                    $('import-status').classList.add('warning');
                    $('import-status').textContent += '\n注意：' + result.warnings.join('\n')
                }
                state.file = null;
                $('document-file').value = '';
                $('selected-file').textContent = '点击选择，或将文件拖到这里';
                toast('资料处理完成');
                await loadDocuments()
            } catch (e) {
                $('import-status').classList.add('warning');
                $('import-status').textContent = e.message || '导入失败，请重试'
            } finally {
                state.uploading = false;
                $('btn-upload').disabled = !state.file;
                $('btn-upload').textContent = '加入知识库 →'
            }
        }

        async function loadDocuments() {
            try {
                state.documents = (await api('/api/documents')).documents || [];
                $('document-count').textContent = state.documents.length;
                const list = $('document-list');
                list.replaceChildren();
                if (!state.documents.length) {
                    list.append(node('p', 'empty', '还没有导入资料。支持 PDF、PPTX 和 TXT。'));
                    return
                }
                for (const item of state.documents) {
                    const row = node('div', 'doc-row'), main = node('div', 'doc-main');
                    main.append(node('div', 'doc-name', item.filename), node('div', 'doc-meta', (names[item.source] || item.source) + ' · ' + (item.size / 1024).toFixed(0) + ' KB' + (item.chunks ? ' · ' + item.chunks + ' 个知识块' : '')));
                    if (item.warnings && item.warnings.length) main.append(node('div', 'doc-warning', '部分图片未识别，请查看导入时的提示'));
                    row.append(node('span', 'doc-icon', item.filename.split('.').pop().toUpperCase()), main);
                    list.append(row)
                }
            } catch (e) {
                $('document-list').replaceChildren(node('p', 'empty', e.message));
                $('document-count').textContent = '—'
            }
        }

        async function health() {
            try {
                const response = await fetch('/health'), data = await response.json();
                $('health').classList.toggle('ready', !!data.ready);
                $('health').textContent = !data.ready ? '服务未就绪' : data.retrieval_ready ? '● 知识库已连接' : '仅标准问答可用'
            } catch (e) {
                $('health').textContent = '服务未连接';
                $('health').classList.remove('ready')
            }
        }

        async function bootData() {
            health();
            try {
                const result = await api('/api/sources');
                state.sources = result.sources || [];
                $('filter').replaceChildren(new Option('全部学科', ''));
                $('upload-source').replaceChildren();
                for (const source of state.sources) {
                    $('filter').append(new Option(names[source] || source, source));
                    $('upload-source').append(new Option(names[source] || source, source))
                }
                renderPills();
                loadSessions();
                loadDocuments();
                let saved;
                try {
                    saved = localStorage.getItem('qa_session_id')
                } catch (e) {
                }
                if (saved && /^[0-9a-f-]{36}$/i.test(saved)) await switchSession(saved); else await newSession()
            } catch (e) {
                toast(e.message)
            }
        }

        $('btn-send').onclick = send;
        $('btn-new').onclick = newSession;
        $('btn-clear').onclick = () => {
            if (state.messages.length) deleteSession(state.sid); else toast('当前没有需要删除的对话')
        };
        $('session-search').oninput = renderSessions;
        $('filter').onchange = renderPills;
        $('input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                if (!state.busy) send()
            }
        });
        $('input').oninput = () => {
            $('input').style.height = 'auto';
            $('input').style.height = Math.min($('input').scrollHeight, 180) + 'px'
        };
        $('chat-log').onscroll = () => {
            const el = $('chat-log');
            state.stick = el.scrollHeight - el.scrollTop - el.clientHeight < 100
        };
        $('btn-menu').onclick = () => {
            const open = !$('sidebar').classList.contains('open');
            $('sidebar').classList.toggle('open', open);
            $('mask').classList.toggle('open', open);
            $('btn-menu').setAttribute('aria-expanded', String(open))
        };
        $('mask').onclick = closeSidebar;
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeSidebar()
        });
        $('btn-import').onclick = () => openLibrary();
        $('btn-attach').onclick = () => openLibrary();
        $('btn-library').onclick = () => openLibrary('documents');
        $('close-library').onclick = () => $('library-dialog').close();
        $('tab-upload').onclick = () => tab('upload');
        $('tab-documents').onclick = () => tab('documents');
        $('droparea').onclick = () => $('document-file').click();
        $('document-file').onchange = () => selectFile($('document-file').files[0]);
        $('droparea').ondragover = e => {
            e.preventDefault();
            $('droparea').classList.add('over')
        };
        $('droparea').ondragleave = () => $('droparea').classList.remove('over');
        $('droparea').ondrop = e => {
            e.preventDefault();
            $('droparea').classList.remove('over');
            selectFile(e.dataTransfer.files[0])
        };
        $('btn-upload').onclick = upload;
        $('btn-theme').onclick = () => {
            const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            try {
                localStorage.setItem('qa_theme', theme)
            } catch (e) {
            }
        };
        $('btn-export').onclick = () => {
            if (!state.messages.length) {
                toast('还没有可以导出的对话');
                return
            }
            const text = state.messages.map(m => (m.role === 'user' ? '我：' : '知序：') + m.text + (m.sources && m.sources.length ? '\n来源：' + m.sources.map(s => s.title).join('、') : '')).join('\n\n');
            const url = URL.createObjectURL(new Blob([text], {type: 'text/plain;charset=utf-8'})),
                link = document.createElement('a');
            link.href = url;
            link.download = '知序对话-' + new Date().toISOString().slice(0, 10) + '.txt';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000)
        };
        $('login-dialog').addEventListener('cancel', e => e.preventDefault());
        $('login-form').onsubmit = async e => {
            e.preventDefault();
            const button = e.submitter;
            button.disabled = true;
            try {
                await api('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: $('access-token').value})
                });
                $('access-token').value = '';
                $('login-dialog').close();
                $('login-error').textContent = '';
                await bootData()
            } catch (error) {
                $('login-error').textContent = error.message
            } finally {
                button.disabled = false
            }
        };
        suggestions();
        (async () => {
            try {
                const auth = await api('/api/auth/status');
                if (auth.remote_disabled) {
                    toast('此服务仅允许本机访问，远程使用需要管理员设置访问口令');
                    return
                }
                if (auth.required && !auth.authenticated) {
                    $('login-dialog').showModal();
                    return
                }
                await bootData()
            } catch (e) {
                toast(e.message);
                health()
            }
        })();
    })();</script>
</body>
</html>
