<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title>学科知识问答系统</title>
<style>
:root{
  --bg:#f7f8fa;
  --surface:#ffffff;
  --surface-2:#f2f4f8;
  --surface-3:#e9edf3;
  --border:#e4e7ec;
  --border-strong:#d3d8e0;
  --text:#14181f;
  --text-2:#5b6472;
  --text-3:#8c95a4;
  --brand:#2f6bff;
  --brand-hover:#1f57e0;
  --brand-soft:#eaf0ff;
  --accent:#7c5cff;
  --ok:#0f9d6b;
  --danger:#e04b4f;
  --danger-soft:#fdecec;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 6px 24px rgba(16,24,40,.08);
  --shadow-lg:0 16px 48px rgba(16,24,40,.12);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116;
    --surface:#161b22;
    --surface-2:#1b2230;
    --surface-3:#232b3a;
    --border:#252d3a;
    --border-strong:#333d4e;
    --text:#e8ecf3;
    --text-2:#9aa4b2;
    --text-3:#6d7787;
    --brand:#5b8cff;
    --brand-hover:#77a1ff;
    --brand-soft:#1a2740;
    --accent:#9d84ff;
    --ok:#2ecc94;
    --danger:#ff6b6f;
    --danger-soft:#2a1a1c;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 24px rgba(0,0,0,.5);
    --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

.app{
  display:flex;
  flex-direction:column;
  height:100dvh;
  min-height:100%;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 24px;
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
  padding-top:max(14px, env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  flex:0 0 auto;
  width:38px;height:38px;
  border-radius:11px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--accent));
  box-shadow:var(--shadow-sm);
}
.logo svg{width:20px;height:20px;display:block}
.brand-text{min-width:0}
.brand-text h1{
  margin:0;
  font-size:15px;
  font-weight:600;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sub{
  margin:1px 0 0;
  font-size:12px;
  color:var(--text-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}

/* ---------- 控件 ---------- */
.btn{
  appearance:none;
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  line-height:1;
  padding:9px 14px;
  border-radius:var(--r-md);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-2);
  cursor:pointer;
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .08s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{
  background:var(--brand);
  border-color:transparent;
  color:#fff;
  box-shadow:0 2px 8px color-mix(in srgb, var(--brand) 32%, transparent);
}
.btn.primary:hover{background:var(--brand-hover);color:#fff}
.btn.primary:disabled{
  background:var(--surface-3);
  color:var(--text-3);
  box-shadow:none;
  cursor:not-allowed;
  transform:none;
}
.btn.ghost.danger:hover{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb, var(--danger) 30%, transparent)}

.select-wrap{position:relative;display:inline-flex;align-items:center}
.select-wrap::after{
  content:"";
  position:absolute;right:11px;top:50%;
  width:6px;height:6px;
  margin-top:-4px;
  border-right:1.5px solid var(--text-3);
  border-bottom:1.5px solid var(--text-3);
  transform:rotate(45deg);
  pointer-events:none;
}
select{
  appearance:none;
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  padding:9px 30px 9px 12px;
  border:1px solid var(--border);
  border-radius:var(--r-md);
  background:var(--surface);
  color:var(--text-2);
  cursor:pointer;
  transition:border-color .16s ease,background .16s ease;
}
select:hover{border-color:var(--border-strong);color:var(--text)}
select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- 消息区 ---------- */
.log{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  padding:28px 24px 8px;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}
.log-inner{
  width:100%;
  max-width:820px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:22px;
}

/* 空状态 */
.welcome{
  margin:6vh auto 0;
  max-width:560px;
  text-align:center;
  animation:fade-up .5s ease both;
}
.welcome .badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;
  font-size:12px;
  font-weight:500;
  color:var(--brand);
  background:var(--brand-soft);
  border-radius:999px;
  margin-bottom:18px;
}
.welcome h2{
  margin:0 0 10px;
  font-size:26px;
  font-weight:600;
  letter-spacing:-.01em;
}
.welcome p{
  margin:0 0 26px;
  color:var(--text-2);
  font-size:14px;
}
.chips{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.chip{
  text-align:left;
  font-family:inherit;
  font-size:13.5px;
  color:var(--text-2);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:12px 14px;
  cursor:pointer;
  transition:border-color .16s ease,background .16s ease,color .16s ease,transform .16s ease;
}
.chip:hover{
  color:var(--text);
  border-color:color-mix(in srgb, var(--brand) 45%, var(--border));
  background:var(--surface);
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 消息行 */
.row{
  display:flex;
  gap:12px;
  animation:fade-up .32s ease both;
}
.row.user{justify-content:flex-end}
.avatar{
  flex:0 0 auto;
  width:30px;height:30px;
  border-radius:9px;
  display:grid;place-items:center;
  font-size:12px;
  font-weight:600;
  user-select:none;
}
.row.bot .avatar{
  background:linear-gradient(135deg,var(--brand),var(--accent));
  color:#fff;
}
.bubble{
  max-width:min(680px,86%);
  padding:13px 16px;
  border-radius:var(--r-lg);
  position:relative;
  word-break:break-word;
}
.row.user .bubble{
  background:var(--brand);
  color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:0 2px 10px color-mix(in srgb, var(--brand) 26%, transparent);
}
.row.bot .bubble{
  background:var(--surface);
  border:1px solid var(--border);
  border-bottom-left-radius:6px;
  box-shadow:var(--shadow-sm);
}
.content{
  white-space:pre-wrap;
  font-size:14.5px;
  line-height:1.72;
}
.row.bot .content{color:var(--text)}
.row.user .content{color:#fff}

/* 打字光标 */
.caret{
  display:inline-block;
  width:2px;height:1.05em;
  margin-left:2px;
  vertical-align:-2px;
  background:var(--brand);
  animation:blink 1.05s steps(1) infinite;
  border-radius:1px;
}

/* 三点等待 */
.dots{display:inline-flex;gap:4px;align-items:center;height:1.2em}
.dots i{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--text-3);
  animation:bounce 1.2s ease-in-out infinite;
}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}

/* 消息脚注 */
.meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
  font-size:11.5px;
  color:var(--text-3);
}
.meta .sep{opacity:.45}
.meta button{
  appearance:none;
  border:0;
  background:transparent;
  padding:2px 4px;
  font:inherit;
  font-size:11.5px;
  color:var(--text-3);
  border-radius:5px;
  cursor:pointer;
  transition:color .16s ease,background .16s ease;
}
.meta button:hover{color:var(--brand);background:var(--brand-soft)}
.meta button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* 错误气泡 */
.row.bot .bubble.error{
  background:var(--danger-soft);
  border-color:color-mix(in srgb, var(--danger) 34%, transparent);
  color:var(--danger);
}

/* ---------- 输入区 ---------- */
.composer{
  position:sticky;
  bottom:0;
  z-index:15;
  padding:12px 24px max(18px, env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 62%, transparent);
}
.composer-inner{
  width:100%;
  max-width:820px;
  margin:0 auto;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:8px 8px 8px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-md);
  transition:border-color .18s ease,box-shadow .18s ease;
}
.composer-inner:focus-within{
  border-color:color-mix(in srgb, var(--brand) 55%, var(--border));
  box-shadow:0 0 0 4px color-mix(in srgb, var(--brand) 12%, transparent), var(--shadow-md);
}
#input{
  flex:1 1 auto;
  min-height:24px;
  max-height:168px;
  padding:8px 0;
  border:0;
  outline:none;
  resize:none;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:14.5px;
  line-height:1.6;
  overflow-y:auto;
}
#input::placeholder{color:var(--text-3)}
.icon-btn{
  flex:0 0 auto;
  width:38px;height:38px;
  display:grid;place-items:center;
  border:0;
  border-radius:50%;
  background:var(--brand);
  color:#fff;
  cursor:pointer;
  transition:background .16s ease,transform .08s ease,opacity .16s ease;
  box-shadow:0 2px 8px color-mix(in srgb, var(--brand) 32%, transparent);
}
.icon-btn:hover{background:var(--brand-hover)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.icon-btn:disabled{background:var(--surface-3);color:var(--text-3);box-shadow:none;cursor:not-allowed;transform:none}
.icon-btn svg{width:17px;height:17px;display:block}
.icon-btn.stop{background:var(--danger);box-shadow:0 2px 8px color-mix(in srgb,var(--danger) 32%,transparent)}
.icon-btn.stop:hover{background:color-mix(in srgb,var(--danger) 86%, #000)}
.hint{
  max-width:820px;
  margin:9px auto 0;
  font-size:11.5px;
  color:var(--text-3);
  text-align:center;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);
  padding:10px 16px;
  font-size:13px;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  z-index:50;
  max-width:calc(100vw - 40px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 动画 ---------- */
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 响应式 ---------- */
@media (max-width:820px){
  .log{padding:22px 16px 6px}
  .composer{padding-left:12px;padding-right:12px}
  .welcome h2{font-size:22px}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .topbar{padding:10px 14px;gap:10px}
  .logo{width:34px;height:34px;border-radius:10px}
  .brand-text h1{font-size:14px}
  .sub{display:none}
  .actions{gap:6px}
  .btn{padding:8px 11px;font-size:12.5px}
  #btn-new{display:none}
  select{padding:8px 28px 8px 10px;font-size:12.5px}
  .log{padding:18px 12px 4px}
  .log-inner{gap:18px}
  .bubble{max-width:88%;padding:11px 13px}
  .content{font-size:14px}
  .chips{grid-template-columns:1fr}
  .welcome{margin-top:4vh}
  .composer{padding:10px 10px max(12px, env(safe-area-inset-bottom))}
  .composer-inner{padding:6px 6px 6px 13px;border-radius:18px}
  .hint{display:none}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .log{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 4.9L19 9.8l-5.1 1.9L12 16.6l-1.9-4.9L5 9.8l5.1-1.9L12 3z"/>
          <path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>学科知识问答系统</h1>
        <p class="sub">Python / Java / AI / MySQL / Redis · RAG 检索增强</p>
      </div>
    </div>
    <div class="actions">
      <label class="select-wrap">
        <span class="sr-only">学科筛选</span>
        <select id="filter" title="限定检索的学科范围">
          <option value="">全部学科</option>
        </select>
      </label>
      <button id="btn-new" class="btn ghost" type="button">新会话</button>
      <button id="btn-clear" class="btn ghost danger" type="button">清空</button>
    </div>
  </header>

  <main id="log" class="log" role="log" aria-live="polite" aria-label="对话记录">
    <div class="log-inner">
      <section class="welcome" id="welcome">
        <span class="badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
          </svg>
          已连接
        </span>
        <h2>有什么可以帮你？</h2>
        <p>覆盖 Python、Java、AI、MySQL、Redis 五个学科的核心知识点。回答会先查本地知识库，检索不到再交给大模型。</p>
        <div class="chips" id="chips">
          <button class="chip" type="button" data-q="Python 的 GIL 是什么？为什么多线程不能利用多核">Python 的 GIL 是什么？为什么多线程不能利用多核</button>
          <button class="chip" type="button" data-q="MySQL 的索引为什么使用 B+ 树">MySQL 的索引为什么使用 B+ 树</button>
          <button class="chip" type="button" data-q="Redis 的缓存穿透、击穿、雪崩有什么区别">Redis 的缓存穿透、击穿、雪崩有什么区别</button>
          <button class="chip" type="button" data-q="RAG 解决了大模型的什么问题">RAG 解决了大模型的什么问题</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="输入你的问题…" aria-label="问题输入框" autocomplete="off"></textarea>
      <button id="btn-send" class="icon-btn" type="button" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 12h14"/><path d="M13 6.5l5.5 5.5-5.5 5.5"/>
        </svg>
      </button>
    </div>
    <p class="hint">Enter 发送 · Shift + Enter 换行 · 回答由大模型生成，关键信息请自行核实</p>
  </footer>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'qa_session_id';

  var el = {
    log: document.getElementById('log'),
    inner: document.querySelector('.log-inner'),
    welcome: document.getElementById('welcome'),
    chips: document.getElementById('chips'),
    input: document.getElementById('input'),
    send: document.getElementById('btn-send'),
    filter: document.getElementById('filter'),
    btnNew: document.getElementById('btn-new'),
    btnClear: document.getElementById('btn-clear'),
    toast: document.getElementById('toast')
  };

  var state = {
    sessionId: null,
    ws: null,
    streaming: false,
    stickBottom: true,
    toastTimer: null
  };

  /* ---------- 工具 ---------- */
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(function () {
      el.toast.classList.remove('show');
    }, 2400);
  }

  function scrollToBottom(force) {
    if (force || state.stickBottom) {
      el.log.scrollTop = el.log.scrollHeight;
    }
  }

  function hideWelcome() {
    if (el.welcome && el.welcome.parentNode) {
      el.welcome.parentNode.removeChild(el.welcome);
      el.welcome = null;
    }
  }

  /* ---------- 渲染消息 ---------- */
  function addUserMessage(text) {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'row user';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var content = document.createElement('div');
    content.className = 'content';
    content.textContent = text;
    bubble.appendChild(content);
    row.appendChild(bubble);
    el.inner.appendChild(row);
    scrollToBottom(true);
  }

  function addBotMessage() {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'row bot';

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.setAttribute('aria-hidden', 'true');
    avatar.textContent = 'AI';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    var content = document.createElement('div');
    content.className = 'content';

    var dots = document.createElement('span');
    dots.className = 'dots';
    dots.innerHTML = '<i></i><i></i><i></i>';
    content.appendChild(dots);

    bubble.appendChild(content);
    row.appendChild(avatar);
    row.appendChild(bubble);
    el.inner.appendChild(row);
    scrollToBottom(true);

    return { row: row, bubble: bubble, content: content, dots: dots, started: false, textNode: null, caret: null };
  }

  // 建立"文本节点 + 光标"的结构。光标必须是独立节点，
  // 否则每次追加文字都会把光标一起覆盖掉，打字效果就没了。
  function ensureTextNode(msg) {
    if (msg.textNode) return;
    msg.content.textContent = '';
    msg.textNode = document.createTextNode('');
    msg.content.appendChild(msg.textNode);
    msg.caret = document.createElement('span');
    msg.caret.className = 'caret';
    msg.caret.setAttribute('aria-hidden', 'true');
    msg.content.appendChild(msg.caret);
    msg.started = true;
  }

  function appendToken(msg, token) {
    ensureTextNode(msg);
    msg.textNode.nodeValue += token;
    scrollToBottom();
  }

  function finishBotMessage(msg, info) {
    if (msg.caret) { msg.caret.remove(); msg.caret = null; }

    // 用文本内容判断，而不是 started 标记：
    // 收到 start 但一个 token 都没来（比如后端异常）也要给出提示。
    if (!msg.textNode || !msg.textNode.nodeValue) {
      msg.content.textContent = '（没有收到内容，请重试）';
      msg.textNode = null;
    }

    var meta = document.createElement('div');
    meta.className = 'meta';

    if (info && typeof info.processing_time === 'number') {
      var t = document.createElement('span');
      t.textContent = '耗时 ' + info.processing_time.toFixed(2) + 's';
      meta.appendChild(t);
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      meta.appendChild(sep);
    }

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.textContent = '复制';
    copy.addEventListener('click', function () {
      var text = msg.textNode ? msg.textNode.nodeValue : msg.content.textContent;
      var done = function () { copy.textContent = '已复制'; setTimeout(function () { copy.textContent = '复制'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { toast('复制失败'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败'); }
        document.body.removeChild(ta);
      }
    });
    meta.appendChild(copy);

    msg.bubble.appendChild(meta);
    msg.dots.remove();
    scrollToBottom();
  }

  function markError(msg, text) {
    if (msg.dots) msg.dots.remove();
    msg.bubble.classList.add('error');
    msg.content.textContent = text;
    scrollToBottom();
  }

  /* ---------- 会话 ---------- */
  function setSession(id) {
    state.sessionId = id;
    try {
      if (id) localStorage.setItem(STORAGE_KEY, id);
      else localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* 隐私模式下忽略 */ }
  }

  function createSession() {
    return fetch('/api/create_session', { method: 'POST' })
      .then(function (r) {
        if (!r.ok) throw new Error('创建会话失败');
        return r.json();
      })
      .then(function (d) {
        setSession(d.session_id);
        return d.session_id;
      });
  }

  // 学科代码 -> 展示名, 避免下拉里出现全大写或小写代码
  var SOURCE_LABELS = { python: 'Python', java: 'Java', ai: 'AI', mysql: 'MySQL', redis: 'Redis' };

  function loadSources() {
    return fetch('/api/sources')
      .then(function (r) { return r.ok ? r.json() : { sources: [] }; })
      .then(function (d) {
        var list = (d && d.sources) || [];
        list.forEach(function (s) {
          var opt = document.createElement('option');
          opt.value = s;
          opt.textContent = SOURCE_LABELS[s] || s.toUpperCase();
          el.filter.appendChild(opt);
        });
      })
      .catch(function () { /* 拿不到就用"全部学科" */ });
  }

  function loadHistory() {
    if (!state.sessionId) return Promise.resolve();
    return fetch('/api/history/' + encodeURIComponent(state.sessionId))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var history = (d && d.history) || [];
        if (!history.length) return;
        history.forEach(function (item) {
          if (item && item.question) addUserMessage(item.question);
          if (item && item.answer) {
            var m = addBotMessage();
            m.content.textContent = '';
            m.started = true;
            m.content.textContent = item.answer;
            m.dots.remove();
          }
        });
        scrollToBottom(true);
      })
      .catch(function () { /* 历史读不到不影响提问 */ });
  }

  /* ---------- 发送 ---------- */
  function setBusy(busy) {
    state.streaming = busy;
    // 生成中这个按钮会变成"停止"，所以不能 disabled，否则永远点不动
    el.send.disabled = false;
    el.send.classList.toggle('stop', busy);
    el.send.setAttribute('aria-label', busy ? '停止生成' : '发送');
    el.send.innerHTML = busy
      ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12h14"/><path d="M13 6.5l5.5 5.5-5.5 5.5"/></svg>';
  }

  function stopStreaming() {
    if (state.ws) {
      try { state.ws.close(); } catch (e) { /* ignore */ }
      state.ws = null;
    }
    setBusy(false);
  }

  function send() {
    if (state.streaming) { stopStreaming(); return; }

    var text = el.input.value.trim();
    if (!text) return;

    var sourceFilter = el.filter.value || null;

    el.input.value = '';
    autoGrow();
    addUserMessage(text);

    var msg = addBotMessage();
    setBusy(true);

    var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/stream');
    state.ws = ws;

    var finished = false;

    ws.onopen = function () {
      ws.send(JSON.stringify({
        query: text,
        source_filter: sourceFilter,
        session_id: state.sessionId
      }));
    };

    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.type === 'start') {
        if (m.session_id) setSession(m.session_id);
        ensureTextNode(msg);
        return;
      }
      if (m.type === 'token') {
        appendToken(msg, m.token || '');
        return;
      }
      if (m.type === 'end') {
        finished = true;
        finishBotMessage(msg, m);
        setBusy(false);
        try { ws.close(); } catch (e) {}
        return;
      }
      if (m.type === 'error') {
        finished = true;
        markError(msg, m.error || '生成失败，请稍后重试');
        setBusy(false);
        try { ws.close(); } catch (e) {}
      }
    };

    ws.onerror = function () {
      if (finished) return;
      finished = true;
      markError(msg, '连接服务失败，请确认后端已启动（默认 8080 端口）');
      setBusy(false);
    };

    ws.onclose = function () {
      state.ws = null;
      if (!finished) {
        finished = true;
        finishBotMessage(msg, null);
        setBusy(false);
      }
    };
  }

  /* ---------- 输入框自适应高度 ---------- */
  function autoGrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 168) + 'px';
  }

  /* ---------- 事件绑定 ---------- */
  el.send.addEventListener('click', send);

  el.input.addEventListener('input', autoGrow);

  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  el.log.addEventListener('scroll', function () {
    var gap = el.log.scrollHeight - el.log.scrollTop - el.log.clientHeight;
    state.stickBottom = gap < 90;
  });

  el.chips.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    var q = chip.getAttribute('data-q') || '';
    if (!q) return;
    el.input.value = q;
    autoGrow();
    send();
  });

  el.btnNew.addEventListener('click', function () {
    stopStreaming();
    el.inner.innerHTML = '';
    setSession(null);
    createSession().then(function () {
      location.reload();
    }).catch(function () { toast('新建会话失败'); });
  });

  el.btnClear.addEventListener('click', function () {
    if (!state.sessionId) {
      el.inner.innerHTML = '';
      toast('已清空当前显示');
      return;
    }
    fetch('/api/history/' + encodeURIComponent(state.sessionId), { method: 'DELETE' })
      .catch(function () { /* 后端不可用也清掉本地显示 */ })
      .then(function () {
        el.inner.innerHTML = '';
        toast('历史记录已清除');
      });
  });

  /* ---------- 启动 ---------- */
  function boot() {
    setBusy(false);
    autoGrow();

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    loadSources();

    if (saved) {
      state.sessionId = saved;
      loadHistory();
    } else {
      createSession().catch(function () {
        toast('无法创建会话，后端可能未启动');
      });
    }

    el.input.focus({ preventScroll: true });
  }

  boot();
})();
</script>
</body>
</html>
