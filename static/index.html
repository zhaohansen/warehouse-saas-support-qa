<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>企业知识库问答工作台</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --sidebar: #fbfbfc;
            --ink: #1f2937;
            --ink-soft: #344054;
            --muted: #667085;
            --line: #e4e7ec;
            --line-strong: #d0d5dd;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-soft: #eff4ff;
            --success: #067647;
            --success-soft: #ecfdf3;
            --warn: #b54708;
            --warn-soft: #fffaeb;
            --danger: #b42318;
            --danger-soft: #fef3f2;
            --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            --mono: Consolas, "SFMono-Regular", Menlo, monospace;
            color-scheme: light
        }

        * { box-sizing: border-box }

        html, body { height: 100% }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.6 var(--sans);
            -webkit-font-smoothing: antialiased
        }

        button, input, select, textarea { font: inherit; color: inherit }

        button { border: 0; background: none; cursor: pointer }

        button:disabled { cursor: not-allowed; opacity: .5 }

        h1, h2, h3, p { margin: 0 }

        [hidden] { display: none !important }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-columns: 264px minmax(0, 1fr);
            overflow: hidden
        }

        /* ---------- 侧栏 ---------- */
        .sidebar {
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 18px 14px 14px;
            background: var(--sidebar);
            border-right: 1px solid var(--line)
        }

        .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 18px }

        .brand-logo {
            width: 36px;
            height: 36px;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 18px
        }

        .brand-text { min-width: 0; line-height: 1.35 }

        .brand-text strong { display: block; font-size: 15px; font-weight: 700; letter-spacing: .02em }

        .brand-text span { display: block; font-size: 11px; color: var(--muted) }

        .sidebar-close { display: none }

        .new-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            height: 40px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            transition: background .15s
        }

        .new-chat:hover { background: var(--accent-dark) }

        .session-search { margin: 16px 0 14px }

        .session-search input {
            width: 100%;
            height: 36px;
            padding: 0 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            font-size: 13px
        }

        .session-search input::placeholder { color: var(--muted) }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600
        }

        .session-list { flex: 1; min-height: 0; overflow: auto; padding-bottom: 8px }

        .session {
            display: flex;
            align-items: center;
            gap: 2px;
            border-radius: 8px;
            margin: 2px 0
        }

        .session:hover { background: #f0f2f5 }

        .session.active { background: var(--accent-soft) }

        .session-open {
            flex: 1;
            min-width: 0;
            padding: 9px 10px;
            text-align: left;
            border-radius: 8px
        }

        .session-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: var(--ink-soft)
        }

        .session.active .session-title { color: var(--accent-dark); font-weight: 600 }

        .session-meta { display: block; margin-top: 1px; color: var(--muted); font-size: 11px }

        .session-delete {
            flex: none;
            width: 30px;
            height: 30px;
            margin-right: 3px;
            border-radius: 6px;
            color: var(--muted);
            opacity: 0
        }

        .session:hover .session-delete,
        .session:focus-within .session-delete { opacity: 1 }

        .session-delete:hover { background: var(--danger-soft); color: var(--danger) }

        .empty {
            padding: 18px 10px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
            white-space: pre-wrap
        }

        .sidebar-foot { border-top: 1px solid var(--line); padding-top: 10px }

        .library-entry {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 9px 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: left
        }

        .library-entry:hover { background: #f0f2f5 }

        .library-icon { color: var(--muted); font-size: 15px }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            margin-left: auto;
            padding: 0 6px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            font-size: 11px;
            font-weight: 600
        }

        /* ---------- 主区域 ---------- */
        .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg) }

        .topbar {
            flex: none;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--line)
        }

        .topbar-title { display: flex; align-items: center; gap: 10px; min-width: 0 }

        .topbar-title h1 { font-size: 16px; font-weight: 700; letter-spacing: .01em }

        .topbar-title p { margin-top: 1px; color: var(--muted); font-size: 12px }

        .topbar-actions { display: flex; align-items: center; gap: 8px; flex: none }

        .status { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; color: var(--muted); font-size: 12px }

        .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong) }

        .status[data-state=ready] { color: var(--success) }
        .status[data-state=ready] i { background: var(--success) }
        .status[data-state=partial] { color: var(--warn) }
        .status[data-state=partial] i { background: var(--warn) }
        .status[data-state=down] { color: var(--danger) }
        .status[data-state=down] i { background: var(--danger) }

        .ghost-btn, .primary-btn, .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 34px;
            padding: 0 12px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap
        }

        .ghost-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft) }

        .ghost-btn:hover { border-color: var(--line-strong); background: #f9fafb }

        .primary-btn { background: var(--accent); color: #fff }

        .primary-btn:hover { background: var(--accent-dark) }

        .icon-btn { width: 34px; padding: 0; color: var(--muted); font-size: 15px }

        .icon-btn:hover { background: #f0f2f5; color: var(--ink) }

        .mobile-menu { display: none }

        .scope-bar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            padding: 10px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--line)
        }

        .scope-label { flex: none; color: var(--muted); font-size: 12px; font-weight: 600 }

        .scope-tabs {
            display: flex;
            flex: 1 1 auto;
            align-items: center;
            gap: 4px;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: none
        }

        .scope-tabs::-webkit-scrollbar { display: none }

        .scope-tab {
            flex: none;
            height: 30px;
            padding: 0 11px;
            border-radius: 6px;
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
            transition: background .15s, color .15s
        }

        .scope-tab:hover { background: #f2f4f7; color: var(--ink) }

        .scope-tab[aria-pressed=true] {
            background: var(--accent-soft);
            color: var(--accent-dark);
            font-weight: 600;
            box-shadow: inset 0 0 0 1px #c7d7fe
        }

        .scope-note { margin-left: auto; flex: none; color: var(--muted); font-size: 12px }

        .chat-log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain }

        .chat-inner { max-width: 820px; margin: 0 auto; padding: 0 28px }

        /* ---------- 欢迎页 ---------- */
        .welcome { padding: clamp(40px, 8vh, 76px) 0 30px }

        .intro { margin-top: 10px; max-width: 36em; color: var(--muted); font-size: 14px; line-height: 1.85 }

        .quick { margin-top: 32px }

        .quick-head {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em
        }

        .quick-list { display: grid; gap: 8px }

        .quick-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            text-align: left;
            transition: border-color .15s, background .15s
        }

        .quick-item:hover { border-color: #b9c8f5; background: #fbfcff }

        .quick-tag {
            flex: none;
            min-width: 54px;
            padding: 2px 7px;
            border-radius: 5px;
            background: #f2f4f7;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            text-align: center
        }

        .quick-item p { min-width: 0; font-size: 14px; color: var(--ink-soft) }

        .quick-item::after { content: "→"; margin-left: auto; color: var(--muted); font-size: 13px }

        .welcome-note { margin-top: 18px; color: var(--muted); font-size: 12px }

        /* ---------- 消息 ---------- */
        .messages { padding: 28px 0 20px }

        .message + .message { margin-top: 28px }

        .message.user { display: flex; justify-content: flex-end }

        .message.user .message-body {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 12px 12px 4px 12px;
            background: var(--accent-soft);
            color: var(--ink);
            white-space: pre-wrap;
            overflow-wrap: anywhere
        }

        .assistant-label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600
        }

        .assistant-label::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent)
        }

        .prose { font-size: 15px; line-height: 1.85; overflow-wrap: anywhere }

        .prose.is-streaming { white-space: pre-wrap }

        .prose.is-streaming::after {
            content: "▍";
            margin-left: 2px;
            color: var(--accent);
            animation: blink 1s steps(2, start) infinite
        }

        @keyframes blink { to { visibility: hidden } }

        .prose p + p { margin-top: 10px }

        .prose h3, .prose h4 { margin: 16px 0 6px; line-height: 1.5 }

        .prose h3 { font-size: 16px }
        .prose h4 { font-size: 15px }

        .prose ul, .prose ol { margin: 8px 0; padding-left: 1.45em }

        .prose li + li { margin-top: 4px }

        .prose blockquote {
            margin: 12px 0;
            padding: 2px 0 2px 12px;
            border-left: 3px solid var(--line-strong);
            color: var(--muted)
        }

        .prose hr { margin: 18px 0; border: 0; border-top: 1px solid var(--line) }

        .prose code {
            padding: 1px 5px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #f8fafc;
            color: var(--ink-soft);
            font: 12.5px/1.6 var(--mono)
        }

        .codeblock {
            margin: 12px 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfd
        }

        .codebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 1px solid var(--line);
            background: #f2f4f7;
            color: var(--muted);
            font: 11px var(--mono)
        }

        .codebar button { color: var(--muted); font-size: 11px; padding: 2px 5px; border-radius: 4px }

        .codebar button:hover { color: var(--accent); background: var(--surface) }

        .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto }

        .codeblock pre code { padding: 0; border: 0; background: transparent; font: 12.5px/1.7 var(--mono); white-space: pre }

        .table-wrap { margin: 12px 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }

        .prose table { width: 100%; border-collapse: collapse; font-size: 13px }

        .prose th, .prose td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }

        .prose th { background: #f8fafc; font-weight: 600; white-space: nowrap }

        .prose tr:last-child td { border-bottom: 0 }

        .citation {
            display: inline;
            padding: 0 2px;
            border-radius: 3px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            vertical-align: super;
            line-height: 1
        }

        .citation:hover { background: var(--accent-soft) }

        .thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px }

        .thinking i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.1s ease-in-out infinite
        }

        @keyframes pulse { 50% { opacity: .25 } }

        .answer-error {
            margin-top: 10px;
            padding: 9px 11px;
            border: 1px solid #fecdca;
            border-radius: 7px;
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 13px
        }

        .answer-notice {
            margin-top: 10px;
            padding: 8px 11px;
            border: 1px solid #fedf89;
            border-radius: 7px;
            background: var(--warn-soft);
            color: var(--warn);
            font-size: 12.5px
        }

        .answer-foot {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 12px
        }

        .answer-foot button {
            padding: 2px 7px;
            border-radius: 4px;
            color: var(--muted);
            font-size: 12px
        }

        .answer-foot button:hover { background: #f2f4f7; color: var(--ink) }

        /* ---------- 来源 ---------- */
        .sources { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line) }

        .sources-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600
        }

        .source-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }

        .source {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 7px 8px;
            border: 1px solid transparent;
            border-radius: 7px;
            transition: background .2s, border-color .2s
        }

        .source:hover { background: #f9fafb }

        .source.flash { background: var(--accent-soft); border-color: #c7d7fe }

        .source-index {
            flex: none;
            display: grid;
            place-items: center;
            width: 20px;
            height: 20px;
            margin-top: 1px;
            border-radius: 5px;
            background: #f2f4f7;
            color: var(--muted);
            font: 600 11px var(--mono)
        }

        .source-main { min-width: 0; flex: 1 }

        .source-title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            overflow-wrap: anywhere
        }

        .source-meta { margin-top: 1px; color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere }

        .tag {
            flex: none;
            padding: 1px 6px;
            border-radius: 4px;
            background: #f2f4f7;
            color: var(--muted);
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1.6
        }

        .tag.faq { background: var(--accent-soft); color: var(--accent-dark) }
        .tag.demo { background: var(--warn-soft); color: var(--warn) }

        .source-empty { margin-top: 10px; color: var(--muted); font-size: 12px }

        /* ---------- 输入区 ---------- */
        .composer {
            flex: none;
            padding: 12px 28px max(14px, env(safe-area-inset-bottom));
            background: var(--surface);
            border-top: 1px solid var(--line)
        }

        .composer-inner { max-width: 820px; margin: 0 auto }

        .kb-banner {
            margin-bottom: 9px;
            padding: 8px 11px;
            border: 1px solid #fedf89;
            border-radius: 7px;
            background: var(--warn-soft);
            color: var(--warn);
            font-size: 12px
        }

        .inputbox {
            padding: 11px 12px 9px 14px;
            border: 1px solid var(--line-strong);
            border-radius: 11px;
            background: var(--surface);
            transition: border-color .15s, box-shadow .15s
        }

        .inputbox:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #2563eb1a
        }

        .inputbox textarea {
            display: block;
            width: 100%;
            min-height: 44px;
            max-height: 180px;
            padding: 0;
            border: 0;
            outline: none !important;
            resize: none;
            background: transparent;
            font-size: 15px;
            line-height: 1.7
        }

        .inputbox textarea::placeholder { color: #98a2b3 }

        .composer-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 6px
        }

        .input-hint { color: var(--muted); font-size: 11.5px }

        .send-btn {
            height: 34px;
            min-width: 72px;
            padding: 0 15px;
            border-radius: 7px;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 600
        }

        .send-btn:hover:not(:disabled) { background: var(--accent-dark) }

        .send-btn.stop { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 1px #fecdca }

        .send-btn.stop:hover { background: #fee4e2 }

        .disclaimer { margin-top: 7px; text-align: center; color: var(--muted); font-size: 11px }

        /* ---------- 弹窗 ---------- */
        .dialog {
            width: min(640px, calc(100vw - 32px));
            max-height: 86dvh;
            padding: 0;
            border: 0;
            border-radius: 11px;
            background: var(--surface);
            color: var(--ink);
            box-shadow: 0 24px 64px #10182833
        }

        .dialog::backdrop { background: #10182873 }

        .dialog-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line)
        }

        .dialog-head h2 { font-size: 17px; font-weight: 700 }

        .dialog-body { padding: 18px 22px 22px; overflow: auto; max-height: calc(86dvh - 65px) }

        .dialog-intro { margin-bottom: 16px; color: var(--muted); font-size: 12.5px; line-height: 1.7 }

        .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px }

        .tab {
            padding: 9px 0;
            margin-bottom: -1px;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600
        }

        .tab:hover { color: var(--ink) }

        .tab.active { border-color: var(--accent); color: var(--accent-dark) }

        .field-label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 600 }

        .field {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            background: var(--surface);
            font-size: 13px
        }

        .field-note { margin-top: 6px; color: var(--muted); font-size: 11.5px }

        .droparea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            margin-top: 14px;
            padding: 26px 14px;
            border: 1.5px dashed var(--line-strong);
            border-radius: 9px;
            background: #fbfcfd;
            text-align: center;
            transition: border-color .15s, background .15s
        }

        .droparea:hover, .droparea.over { border-color: var(--accent); background: var(--accent-soft) }

        .droparea strong { max-width: 100%; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere }

        .droparea small { color: var(--muted); font-size: 11.5px }

        .upload-summary {
            margin-top: 10px;
            padding: 9px 11px;
            border-radius: 7px;
            background: #f8fafc;
            color: var(--muted);
            font-size: 12px
        }

        .statusbox {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 7px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            font-size: 12.5px;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere
        }

        .statusbox.warning { background: var(--warn-soft); color: var(--warn) }

        .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px }

        .doc-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px
        }

        .doc-toolbar label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px }

/* Workspace theme */
:root {
    --bg: #f4f7fc;

<div class="app">

<div class="toast" id="toast" role="status" hidden></div>

<script>
    (function () {
        'use strict';
        const $ = id => document.getElementById(id),
            names = {policies: '制度规范', products: '产品手册', operations: '业务流程', onboarding: '员工入职'};
        const state = {
            sid: null,
            sessions: [],
            messages: [],
            documents: [],
            sources: [],
            filter: '',
            busy: false,
            ws: null,
            epoch: 0,
            seq: 0,
            uploading: false,
            file: null,
            stick: true,
            historyRequest: 0,
            switching: false,
            ready: null,
            retrievalReady: null,
            confirmAction: null
        };
        let toastTimer, scrollFrame = 0, streamFrame = 0;

        function node(tag, cls, text) {
            const element = document.createElement(tag);
            if (cls) element.className = cls;
            if (text !== undefined) element.textContent = text;
            return element
        }

        function toast(text) {
            $('toast').textContent = text;
            $('toast').hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $('toast').hidden = true, 3600)
        }

        async function api(path, options) {
            const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
            let response;
            try {
                response = await fetch(path, {...options, signal: controller.signal})
            } catch (error) {
                throw new Error(error.name === 'AbortError' ? '请求超时，请稍后重试' : '无法连接服务，请确认服务已启动')
            } finally {
                clearTimeout(timer)
            }
            let data;
            try {
                data = await response.json()
            } catch (error) {
                throw new Error('服务返回异常，请稍后重试')
            }
            if (response.status === 401) {
                if (path !== '/api/auth/login' && !$('login-dialog').open) $('login-dialog').showModal();
                if (path !== '/api/auth/login') throw new Error('请先输入正确的访问口令')
            }
            if (!response.ok) {
                throw new Error(typeof data.detail === 'string' ? data.detail : '操作失败，请重试')
            }
            return data
        }

        function category(value) {
            return names[value] || value || '全部资料'
        }

        function saveSid(sid) {
            state.sid = sid;
            try {
                localStorage.setItem('qa_session_id', sid)
            } catch (error) {
            }
        }

        function scheduleScroll(force) {
            if (force) state.stick = true;
            if (!state.stick) return;
            if (scrollFrame) return;
            scrollFrame = requestAnimationFrame(() => {
                scrollFrame = 0;
                const log = $('chat-log');
                log.scrollTop = log.scrollHeight
            })
        }

        function scrollToBottom() {
            state.stick = true;
            scheduleScroll(true)
        }

        function showChat() {
            const has = state.messages.length > 0;
            $('welcome').hidden = has;
            $('messages').hidden = !has
        }

        function setBusy(value) {
            state.busy = value;
            const button = $('btn-send');
            button.classList.toggle('stop', value);
            button.textContent = value ? '停止' : '发送';
            button.setAttribute('aria-label', value ? '停止生成' : '发送问题');
            button.disabled = !value && state.ready === false
        }

        function setBanner(text) {
            $('kb-banner').textContent = text || '';
            $('kb-banner').hidden = !text
        }

        function setHealth(data) {
            state.ready = !!data.ready;
            state.retrievalReady = !!data.retrieval_ready;
            const status = $('health');
            $('btn-send').disabled = !state.ready;
            $('input').placeholder = state.ready
                ? '输入问题，例如：协作平台登录不上应该找谁？'
                : '问答服务未就绪，请检查启动日志';
            if (!state.ready) {
                status.dataset.state = 'down';
                status.lastElementChild.textContent = '服务未就绪';
                status.title = '问答服务未就绪，请检查启动日志';
                setBanner('问答服务尚未就绪，暂时无法提问。请检查模型配置或启动日志。')
            } else if (!state.retrievalReady) {
                status.dataset.state = 'partial';
                status.lastElementChild.textContent = '标准问答可用';
                status.title = '资料检索未就绪，标准问答仍可用';
                setBanner('知识库检索暂未就绪，标准问答仍可使用；资料导入可能不可用。')
            } else {
                status.dataset.state = 'ready';
                status.lastElementChild.textContent = '知识库已连接';
                status.title = '知识库检索已就绪';
                setBanner('')
            }

        function closeSidebar() {

            $('mask').classList.remove('open');

        }

            $('mask').classList.add('open');

        }

        /* ---------- Markdown ---------- */
        function renderInline(parent, text, msg) {
            const regex = /(\*\*[^*\n]+\*\*|`[^`\n]+`|\[(\d{1,3})\])/g;
            let cursor = 0, match;
            while ((match = regex.exec(text))) {
                if (match.index > cursor) parent.append(document.createTextNode(text.slice(cursor, match.index)));
                if (match[2]) {
                    const index = String(match[2]);
                    if (msg && msg.sourceIndexes && msg.sourceIndexes.has(index)) {
                        const button = node('button', 'citation', '[' + index + ']');
                        button.type = 'button';
                        button.setAttribute('aria-label', '查看来源 ' + index);
                        button.onclick = () => focusSource(msg, index);
                        parent.append(button)
                    } else {
                        parent.append(document.createTextNode(match[0]))
                    }
                } else if (match[1].startsWith('**')) {
                    parent.append(node('strong', '', match[1].slice(2, -2)))
                } else {
                    parent.append(node('code', '', match[1].slice(1, -1)))
                }
                cursor = regex.lastIndex
            }
            if (cursor < text.length) parent.append(document.createTextNode(text.slice(cursor)))
        }

        function splitCells(line) {
            let value = line.trim();
            if (value.startsWith('|')) value = value.slice(1);
            if (value.endsWith('|')) value = value.slice(0, -1);
            return value.split('|').map(cell => cell.trim())
        }

        function isTableSeparator(line) {
            return /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes('-')
        }

        function isBlockStart(lines, index) {
            const line = lines[index];
            return /^\s*```/.test(line) || /^\s*#{1,4}\s+/.test(line) || /^\s*>/.test(line)
                || /^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) || /^\s*---+\s*$/.test(line)
                || (line.includes('|') && index + 1 < lines.length && isTableSeparator(lines[index + 1]))
        }

        function appendCodeBlock(parent, language, code) {
            const block = node('div', 'codeblock'), bar = node('div', 'codebar'),
                copy = node('button', '', '复制');
            copy.type = 'button';
            copy.onclick = () => copyText(code);
            bar.append(node('span', '', language || 'code'), copy);
            const pre = node('pre'), codeEl = node('code', '', code);
            pre.append(codeEl);
            block.append(bar, pre);
            parent.append(block)
        }

        function appendTable(parent, header, rows, msg) {
            const wrap = node('div', 'table-wrap'), table = node('table');
            const thead = node('thead'), tr = node('tr');
            for (const cell of header) {
                const th = node('th');
                renderInline(th, cell, msg);
                tr.append(th)
            }
            thead.append(tr);
            const tbody = node('tbody');
            for (const row of rows) {
                const line = node('tr');
                const width = Math.max(header.length, row.length);
                for (let index = 0; index < width; index++) {
                    const td = node('td');
                    renderInline(td, row[index] || '', msg);
                    line.append(td)
                }
                tbody.append(line)
            }
            table.append(thead, tbody);
            wrap.append(table);
            parent.append(wrap)
        }

        function renderMarkdown(container, text, msg) {
            container.replaceChildren();
            const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
            let index = 0;
            while (index < lines.length) {
                const line = lines[index];
                const trimmed = line.trim();
                if (!trimmed) {
                    index++;
                    continue
                }
                if (trimmed.startsWith('```')) {
                    const language = trimmed.slice(3).trim();
                    const code = [];
                    index++;
                    while (index < lines.length && !lines[index].trim().startsWith('```')) {
                        code.push(lines[index]);
                        index++
                    }
                    if (index < lines.length) index++;
                    appendCodeBlock(container, language, code.join('\n'));
                    continue
                }
                const heading = /^(#{1,4})\s+(.*)$/.exec(trimmed);
                if (heading) {
                    const tag = heading[1].length <= 2 ? 'h3' : 'h4';
                    const element = node(tag);
                    renderInline(element, heading[2], msg);
                    container.append(element);
                    index++;
                    continue
                }
                if (trimmed === '---' || trimmed === '***') {
                    container.append(node('hr'));
                    index++;
                    continue
                }
                if (trimmed.startsWith('>')) {
                    const quote = [];
                    while (index < lines.length && lines[index].trim().startsWith('>')) {
                        quote.push(lines[index].trim().replace(/^>\s?/, ''));
                        index++
                    }
                    const block = node('blockquote');
                    renderInline(block, quote.join('\n'), msg);
                    container.append(block);
                    continue
                }
                if (line.includes('|') && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
                    const header = splitCells(line);
                    index += 2;
                    const rows = [];
                    while (index < lines.length && lines[index].includes('|') && lines[index].trim()) {
                        rows.push(splitCells(lines[index]));
                        index++
                    }
                    appendTable(container, header, rows, msg);
                    continue
                }
                if (/^\s*[-*+]\s+/.test(line)) {
                    const list = node('ul');
                    while (index < lines.length && /^\s*[-*+]\s+/.test(lines[index])) {
                        const item = node('li');
                        renderInline(item, lines[index].replace(/^\s*[-*+]\s+/, ''), msg);
                        list.append(item);
                        index++
                    }
                    container.append(list);
                    continue
                }
                if (/^\s*\d+[.)]\s+/.test(line)) {
                    const list = node('ol');
                    while (index < lines.length && /^\s*\d+[.)]\s+/.test(lines[index])) {
                        const item = node('li');
                        renderInline(item, lines[index].replace(/^\s*\d+[.)]\s+/, ''), msg);
                        list.append(item);
                        index++
                    }
                    container.append(list);
                    continue
                }
                const paragraph = [line];
                index++;
                while (index < lines.length && lines[index].trim() && !isBlockStart(lines, index)) {
                    paragraph.push(lines[index]);
                    index++
                }
                const block = node('p');
                paragraph.forEach((value, position) => {
                    if (position) block.append(node('br'));
                    renderInline(block, value, msg)
                });
                container.append(block)
            }
            if (!container.childNodes.length) container.append(node('p', '', text || ''))
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                toast('已复制')
            } catch (error) {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.append(area);
                area.select();
                let ok = false;
                try {
                    ok = document.execCommand('copy')
                } catch (ignore) {
                }
                area.remove();
                toast(ok ? '已复制' : '复制失败，请手动选择文字复制')
            }
        }

        /* ---------- 消息 ---------- */
        function focusSource(msg, index) {
            const row = document.getElementById('source-' + msg.id + '-' + index);
            if (!row) return;
            row.scrollIntoView({block: 'nearest', behavior: 'smooth'});
            row.classList.add('flash');
            setTimeout(() => row.classList.remove('flash'), 1600)
        }

        function ensureMessage(msg) {
            if (msg.element) return msg;
            const article = node('article', 'message ' + msg.role);
            const body = node('div', 'message-body');
            if (msg.role === 'assistant') body.append(node('div', 'assistant-label', '知识库助手'));
            msg.prose = node('div', 'prose');
            msg.extra = node('div');
            body.append(msg.prose, msg.extra);
            article.append(body);
            $('messages').append(article);
            msg.element = article;
            return msg
        }

        function showThinking(msg) {
            ensureMessage(msg);
            msg.prose.replaceChildren();
            const box = node('div', 'thinking');
            box.append(node('i'), document.createTextNode('正在检索资料，整理答案…'));
            msg.prose.append(box)
        }

        function rebuildSourceIndexes(msg) {
            msg.sourceIndexes = new Set((msg.sources || []).map(
                (item, position) => String(item.index === undefined || item.index === null ? position + 1 : item.index)))
        }

        function renderSources(msg) {
            const sources = msg.sources || [];
            if (!sources.length) {
                if (msg.error) return;
                let text = '本次回答未引用知识库资料。';
                if (msg.status === '已停止生成') text = '已停止生成，未获取到来源信息。';
                else if ((msg.text || '').includes('没有找到足够相关的资料')) text = '知识库中没有找到足够相关的资料。';
                else if ((msg.text || '').startsWith('以下回答未引用知识库资料')) text = '本次回答未引用知识库资料，请谨慎参考。';
                msg.extra.append(node('div', 'source-empty', text));
                return
            }
            const hasFaq = sources.some(item => String(item.title || '').startsWith('标准问答库'));
            const section = node('section', 'sources');
            const head = node('div', 'sources-head', hasFaq ? '来源 · 标准问答' : '来源 · 知识库资料');
            section.append(head);
            const list = node('ol', 'source-list');
            sources.forEach((item, position) => {
                const index = item.index === undefined || item.index === null ? position + 1 : item.index;
                const title = String(item.title || '来源');
                const isFaq = title.startsWith('标准问答库');
                const document = item.source_doc
                    || (isFaq ? title.replace(/^标准问答库\s*·\s*/, '') : title);
                const row = node('li', 'source');
                row.id = 'source-' + msg.id + '-' + index;
                const badge = node('span', 'source-index', String(index));
                const main = node('div', 'source-main');
                const titleRow = node('div', 'source-title');
                titleRow.append(node('span', '', document || '标准问答库'));
                titleRow.append(node('span', 'tag' + (isFaq ? ' faq' : ''), isFaq ? '标准问答库' : '知识库引用'));
                if ((document || '').includes('虚构演示')) titleRow.append(node('span', 'tag demo', '虚构演示'));
                const meta = [];
                if (item.subject) meta.push(category(item.subject));
                if (item.page) meta.push('第 ' + item.page + ' 页');
                else if (item.slide) meta.push('第 ' + item.slide + ' 张幻灯片');
                if (meta.length) main.append(titleRow, node('div', 'source-meta', meta.join(' · ')));
                else main.append(titleRow);
                row.append(badge, main);
                list.append(row)
            });
            section.append(list);
            msg.extra.append(section)
        }

        function renderExtras(msg) {
            msg.extra.replaceChildren();
            if (msg.error) msg.extra.append(node('div', 'answer-error', msg.error));
            if (msg.notice) msg.extra.append(node('div', 'answer-notice', msg.notice));
            renderSources(msg);
            const foot = node('div', 'answer-foot');
            if (msg.text) {
                const copy = node('button', '', '复制回答');
                copy.type = 'button';
                copy.onclick = () => copyText(msg.text);
                foot.append(copy)
            }
            foot.append(node('span', '', msg.status || ''));
            msg.extra.append(foot)
        }

        function finalizeAssistant(msg) {
            if (msg.done) return;
            msg.done = true;
            ensureMessage(msg);
            msg.prose.classList.remove('is-streaming');
            if (msg.text) {
                rebuildSourceIndexes(msg);
                renderMarkdown(msg.prose, msg.text, msg)
            } else if (!msg.error) {
                msg.prose.replaceChildren(node('div', 'thinking', '未返回回答内容。'))
            } else {
                msg.prose.replaceChildren()
            }
            renderExtras(msg);
            scheduleScroll(false)
        }

        function appendDelta(msg, delta) {
            if (!delta) return;
            ensureMessage(msg);
            if (!msg.streamNode) {
                msg.prose.replaceChildren();
                msg.streamNode = document.createTextNode('');
                msg.prose.append(msg.streamNode);
                msg.prose.classList.add('is-streaming')
            }
            msg.streamNode.appendData(delta);
            if (!streamFrame) {
                streamFrame = requestAnimationFrame(() => {
                    streamFrame = 0;
                    scheduleScroll(false)
                })
            }
        }

        function addMessage(role, text, options) {
            options = options || {};
            const msg = {
                id: ++state.seq,
                role,
                text: text || '',
                status: options.status || (role === 'assistant' ? '正在生成' : ''),
                sources: options.sources || [],
                error: '',
                notice: '',
                done: !!options.instant,
                element: null,
                prose: null,
                extra: null,
                streamNode: null,
                sourceIndexes: new Set()
            };
            state.messages.push(msg);
            showChat();
            ensureMessage(msg);
            if (role === 'user') {
                msg.prose.textContent = msg.text
            } else if (role === 'assistant') {
                if (options.instant) finalizeAssistant(msg);
                else showThinking(msg)
            }
            scheduleScroll(true);
            return msg
        }

        function resetMessages() {
            state.messages = [];
            $('messages').replaceChildren();
            showChat();
            state.stick = true
        }

        /* ---------- 会话 ---------- */
        function renderSessions() {
            const keyword = $('session-search').value.trim().toLowerCase();
            const list = $('session-list');
            list.replaceChildren();
            $('session-count').textContent = state.sessions.length;
            const rows = state.sessions.filter(item => (item.title || '').toLowerCase().includes(keyword));
            if (!rows.length) {
                list.append(node('p', 'empty', keyword ? '没有找到相关对话' : '还没有对话记录\n从右侧的问题开始吧'));
                return
            }
            for (const item of rows) {
                const row = node('div', 'session' + (item.session_id === state.sid ? ' active' : ''));
                const open = node('button', 'session-open');
                open.type = 'button';
                open.title = item.title || '未命名对话';
                open.append(node('span', 'session-title', item.title || '未命名对话'));
                open.append(node('span', 'session-meta',
                    (item.rounds ? item.rounds + ' 轮 · ' : '') + (item.updated_at || '')));
                open.onclick = () => switchSession(item.session_id);
                const remove = node('button', 'session-delete', '×');
                remove.type = 'button';
                remove.setAttribute('aria-label', '删除会话：' + (item.title || '未命名对话'));
                remove.onclick = () => deleteSession(item.session_id, item.title || '未命名对话');
                row.append(open, remove);
                list.append(row)
            }
        }

        async function loadSessions() {
            try {
                state.sessions = (await api('/api/sessions?limit=200')).sessions || [];
                renderSessions()
            } catch (error) {
                if (state.ready !== false) toast(error.message)
            }
        }

        async function newSession() {
            stop();
            const request = ++state.historyRequest;
            state.switching = true;
            try {
                const result = await api('/api/create_session', {method: 'POST'});
                if (request !== state.historyRequest) return;
                saveSid(result.session_id);
                resetMessages();
                renderSessions();
                closeSidebar();
                $('input').focus()
            } catch (error) {
                if (request === state.historyRequest) toast(error.message)
            } finally {
                if (request === state.historyRequest) state.switching = false
            }
        }

        async function switchSession(sid) {
            stop();
            const request = ++state.historyRequest;
            state.switching = false;
            saveSid(sid);
            closeSidebar();
            resetMessages();
            renderSessions();
            try {
                const result = await api('/api/history/' + encodeURIComponent(sid) + '?limit=500');
                if (request !== state.historyRequest || state.sid !== sid) return;
                for (const item of result.history || []) {
                    addMessage('user', item.question);
                    addMessage('assistant', item.answer, {
                        sources: item.sources || [],
                        status: '历史回答',
                        instant: true
                    })
                }
                scrollToBottom()
            } catch (error) {
                if (request === state.historyRequest) toast(error.message)
            }
        }

        function deleteSession(sid, title) {
            confirmAction('删除对话', '确定删除“' + title + '”这段对话吗？删除后无法恢复。', '删除', async () => {
                if (state.sid === sid) stop();
                state.switching = true;
                try {
                    await api('/api/history/' + encodeURIComponent(sid), {method: 'DELETE'});
                    if (state.sid === sid) await newSession();
                    await loadSessions();
                    toast('对话已删除')
                } catch (error) {
                    toast(error.message)
                } finally {
                    state.switching = false
                }
            })
        }

        /* ---------- 检索范围 ---------- */
        function renderScope() {
            const box = $('scope-tabs');
            box.replaceChildren();
            const values = [''].concat(state.sources);
            for (const value of values) {
                const button = node('button', 'scope-tab', category(value));

                };
                box.append(button)

            $('scope-note').textContent = '当前：' + category(state.filter)
        }

        function quickQuestions() {
            const rows = [
                ['协作平台登录不上应该找谁？', '产品手册'],
                ['报销/审批进度在哪里查询？', '制度规范'],
                ['新员工入职第一天几点到哪里报到？', '员工入职']
            ];
            const box = $('suggestions');
            box.replaceChildren();
            for (const [question, tag] of rows) {

                button.type = 'button';
                button.append(node('span', 'quick-tag', tag), node('p', '', question));
                button.onclick = () => {
                    if (state.ready === false) {

                        return
                    }
                    $('input').value = question;
                    send()
                };

            }

        /* ---------- 提问 ---------- */
        function stop() {
            if (state.ws) {
                state.ws.onclose = null;
                state.ws.close();
                state.ws = null
            }
            state.epoch++;
            const msg = state.messages[state.messages.length - 1];
            if (state.busy && msg && msg.role === 'assistant' && !msg.done) {
                msg.status = '已停止生成';
                msg.notice = '已停止生成，本次回答可能不完整。';
                finalizeAssistant(msg)
            }
            setBusy(false)
        }

        function send() {
            if (state.busy) {
                stop();
                return
            }
            if (state.switching) {
                toast('正在开启新对话，请稍候');
                return
            }
            if (state.ready === false) {
                toast('问答服务尚未就绪，请检查启动日志');
                return
            }
            const question = $('input').value.trim();
            if (!question) return;
            if (question.length > 6000) {
                toast('问题不能超过 6000 字');
                return
            }
            if (!state.sid) {
                toast('会话尚未就绪，请稍候重试');
                return
            }
            state.historyRequest++;
            const epoch = ++state.epoch, sid = state.sid, source = state.filter || null;
            addMessage('user', question);
            const answer = addMessage('assistant', '');
            $('input').value = '';
            $('input').style.height = 'auto';
            setBusy(true);
            const socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/stream');
            state.ws = socket;

            function finish(status, error) {
                if (epoch !== state.epoch) return;
                answer.status = status;
                if (error) answer.error = error;
                finalizeAssistant(answer);
                setBusy(false);
                state.ws = null
            }

            socket.onopen = () => socket.send(JSON.stringify({
                query: question,
                source_filter: source,
                session_id: sid
            }));
            socket.onmessage = event => {
                if (epoch !== state.epoch) return;
                let data;
                try {
                    data = JSON.parse(event.data)
                } catch (error) {
                    finish('生成失败', '服务返回格式异常，请重试。');
                    socket.close();
                    return
                }
                if (data.type === 'start') {
                    if (data.session_id) saveSid(data.session_id)
                } else if (data.type === 'token') {
                    answer.text += data.token || '';
                    appendDelta(answer, data.token || '')
                } else if (data.type === 'end') {
                    answer.sources = Array.isArray(data.sources) ? data.sources : [];
                    rebuildSourceIndexes(answer);
                    finish('已完成 · ' + Number(data.processing_time || 0).toFixed(1) + ' 秒');
                    socket.close();
                    loadSessions()
                } else if (data.type === 'error') {
                    finish('生成失败', data.error || '生成失败，请重试。');
                    socket.close()
                }
            };
            socket.onerror = () => {
                if (!answer.done) finish('连接失败', '无法连接问答服务，请确认服务正常后重试。')
            };
            socket.onclose = () => {
                if (!answer.done && epoch === state.epoch) {
                    finish('连接中断', '连接提前中断，当前回答可能不完整，请重试。')
                }
            }
        }

        /* ---------- 资料管理 ---------- */
        function confirmAction(title, message, label, action) {
            $('confirm-title').textContent = title;
            $('confirm-message').textContent = message;
            $('confirm-ok').textContent = label;
            state.confirmAction = action;
            $('confirm-dialog').showModal()
        }

        function tab(name) {
            const upload = name === 'upload';
            $('upload-panel').hidden = !upload;
            $('documents-panel').hidden = upload;
            for (const key of ['upload', 'documents']) {
                $('tab-' + key).classList.toggle('active', (key === 'upload') === upload);
                $('tab-' + key).setAttribute('aria-selected', String((key === 'upload') === upload))
            }
            if (!upload) loadDocuments()
        }

        function openLibrary(name) {
            closeSidebar();
            if (state.filter && $('upload-source').value !== state.filter) $('upload-source').value = state.filter;
            updateUploadSummary();
            tab(name || 'upload');
            $('library-dialog').showModal()
        }

        function updateUploadSummary() {
            const source = $('upload-source').value;
            if (state.file) {
                $('upload-summary').textContent = '将导入：' + state.file.name + ' → ' + category(source)
            } else {
                $('upload-summary').textContent = '请选择文件并确认资料分类'
            }
        }

        function selectFile(file) {
            if (state.uploading) return;
            state.file = null;
            $('document-file').value = '';
            $('selected-file').textContent = '点击选择，或将文件拖到这里';
            $('btn-upload').disabled = true;
            $('import-status').hidden = true;
            $('import-status').classList.remove('warning');
            if (!file) return;
            if (!/\.(pdf|pptx|txt)$/i.test(file.name) || !file.size || file.size > 20 * 1024 * 1024) {
                $('import-status').hidden = false;
                $('import-status').textContent = '请选择非空且不超过 20 MB 的 PDF、PPTX 或 TXT。旧版 PPT 请先另存为 PPTX。';
                $('btn-upload').disabled = true;
                return
            }
            state.file = file;
            $('selected-file').textContent = file.name;
            $('btn-upload').disabled = false
        }

        async function upload() {
            if (state.uploading || !state.file) return;
            const source = $('upload-source').value, file = state.file;
            if (!source) {
                toast('请先选择资料分类');
                return
            }
            state.uploading = true;
            $('btn-upload').disabled = true;
            $('btn-upload').textContent = '正在处理…';
            $('import-status').hidden = false;
            $('import-status').classList.remove('warning');
            $('import-status').textContent = '正在处理 ' + file.name + '（' + category(source) + '），请稍候。';
            try {
                const params = new URLSearchParams({source, filename: file.name});
                const response = await fetch('/api/documents?' + params, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/octet-stream'},
                    body: file
                });
                let result = {};
                try {
                    result = await response.json()
                } catch (error) {
                }
                if (response.status === 401 && !$('login-dialog').open) $('login-dialog').showModal();
                if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : '导入失败，请重试');
                $('import-status').textContent = result.status === 'already_imported'
                    ? '该文件已在“' + category(source) + '”中，无需重复导入。'
                    : '已加入“' + category(source) + '”，共 ' + (result.chunks || 0) + ' 个知识块。';
                if (result.warnings && result.warnings.length) {
                    $('import-status').classList.add('warning');
                    $('import-status').textContent += '\n注意：' + result.warnings.join('\n')
                }
                state.file = null;
                $('document-file').value = '';
                $('selected-file').textContent = '点击选择，或将文件拖到这里';
                updateUploadSummary();
                toast('资料处理完成');
                await loadDocuments()
            } catch (error) {
                $('import-status').classList.add('warning');
                $('import-status').textContent = error.message || '导入失败，请重试'
            } finally {
                state.uploading = false;
                $('btn-upload').disabled = !state.file;
                $('btn-upload').textContent = '加入知识库'
            }
        }

        async function loadDocuments() {
            const source = $('doc-filter').value || '';
            try {
                const query = source ? '?source=' + encodeURIComponent(source) : '';
                const result = await api('/api/documents' + query);
                state.documents = result.documents || [];
                if (!source) $('document-count').textContent = state.documents.length;
                $('doc-total').textContent = '共 ' + state.documents.length + ' 份';
                const list = $('document-list');
                list.replaceChildren();
                if (!state.documents.length) {
                    list.append(node('p', 'empty', source ? '该分类下还没有导入资料。' : '还没有导入资料。\n支持 PDF、PPTX 和 TXT，单份不超过 20 MB。'));
                    return
                }
                for (const item of state.documents) {
                    const row = node('div', 'doc-row');
                    const extension = item.filename.split('.').pop().toUpperCase();
                    const main = node('div', 'doc-main');
                    const name = node('div', 'doc-name');
                    name.append(node('span', '', item.filename));
                    if (item.filename.includes('虚构演示')) name.append(node('span', 'tag demo', '虚构演示'));
                    const meta = [category(item.source), item.size < 1024 ? '<1 KB' : Math.round(item.size / 1024) + ' KB'];
                    if (item.chunks) meta.push(item.chunks + ' 个知识块');
                    main.append(name, node('div', 'doc-meta', meta.join(' · ')));
                    if (item.warnings && item.warnings.length) {
                        main.append(node('div', 'doc-warning', '部分内容未能识别，请查看导入提示'))
                    }
                    const remove = node('button', 'doc-delete', '删除');
                    remove.type = 'button';
                    remove.setAttribute('aria-label', '删除资料 ' + item.filename);
                    remove.onclick = () => {
                        confirmAction('删除资料',
                            '确定删除“' + item.filename + '”（' + category(item.source) + '）及其知识库索引吗？此操作无法撤销。',
                            '删除', async () => {
                                remove.disabled = true;
                                try {
                                    const params = new URLSearchParams({source: item.source, document_id: item.id});
                                    await api('/api/documents?' + params, {method: 'DELETE'});
                                    toast('资料已删除');
                                    await loadDocuments()
                                } catch (error) {
                                    toast(error.message || '删除失败，请重试');
                                    remove.disabled = false
                                }
                            })
                    };
                    row.append(node('span', 'doc-icon', extension), main, remove);
                    list.append(row)
                }
            } catch (error) {
                $('document-list').replaceChildren(node('p', 'empty', error.message));
                $('document-count').textContent = '—';
                $('doc-total').textContent = ''
            }
        }

        /* ---------- 状态与启动 ---------- */
        async function health() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                setHealth(data)
            } catch (error) {
                $('health').dataset.state = 'down';
                $('health').lastElementChild.textContent = '服务未连接';
                $('health').title = '无法连接服务';
                state.ready = false;
                $('btn-send').disabled = true;
                setBanner('无法连接问答服务，请确认服务已启动。')
            }
        }

        async function bootData() {
            health();
            try {
                const result = await api('/api/sources');
                state.sources = result.sources || [];
                const upload = $('upload-source'), filter = $('doc-filter');
                upload.replaceChildren();
                filter.replaceChildren(new Option('全部资料', ''));
                for (const source of state.sources) {
                    upload.append(new Option(category(source), source));
                    filter.append(new Option(category(source), source))
                }
                if (state.filter && !state.sources.includes(state.filter)) state.filter = '';
                renderScope();
                loadSessions();
                loadDocuments();
                let saved;
                try {
                    saved = localStorage.getItem('qa_session_id')
                } catch (error) {
                }
                if (saved && /^[0-9a-f-]{36}$/i.test(saved)) await switchSession(saved);
                else await newSession()
            } catch (error) {
                toast(error.message)
            }
        }

        /* ---------- 事件 ---------- */
        $('btn-send').onclick = send;
        $('btn-new').onclick = newSession;
        $('btn-export').onclick = () => {
            if (!state.messages.length) {
                toast('还没有可以导出的对话');
                return
            }
            const text = state.messages.map(message => {
                const role = message.role === 'user' ? '我：' : '知识库助手：';
                const sources = (message.sources || []).map(item => item.title).filter(Boolean);
                return role + message.text + (sources.length ? '\n来源：' + sources.join('、') : '')
            }).join('\n\n');
            const url = URL.createObjectURL(new Blob([text], {type: 'text/plain;charset=utf-8'}));
            const link = document.createElement('a');
            link.href = url;
            link.download = '知识库对话-' + new Date().toISOString().slice(0, 10) + '.txt';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000)
        };
        $('session-search').oninput = renderSessions;
        $('input').addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
                event.preventDefault();
                if (!state.busy) send()
            }
        });
        $('input').oninput = () => {
            $('input').style.height = 'auto';
            $('input').style.height = Math.min($('input').scrollHeight, 180) + 'px'
        };
        $('chat-log').onscroll = () => {
            const element = $('chat-log');
            state.stick = element.scrollHeight - element.scrollTop - element.clientHeight < 80
        };
        $('btn-menu').onclick = () => {
            if ($('sidebar').classList.contains('open')) closeSidebar(); else openSidebar()
        };
        $('btn-sidebar-close').onclick = closeSidebar;
        $('mask').onclick = closeSidebar;
        $('btn-import').onclick = () => openLibrary('upload');
        $('btn-library').onclick = () => openLibrary('documents');
        $('close-library').onclick = () => $('library-dialog').close();
        $('tab-upload').onclick = () => tab('upload');
        $('tab-documents').onclick = () => tab('documents');
        $('droparea').onclick = () => $('document-file').click();
        $('document-file').onchange = () => {
            selectFile($('document-file').files[0]);
            updateUploadSummary()
        };
        $('droparea').ondragover = event => {
            event.preventDefault();
            $('droparea').classList.add('over')
        };
        $('droparea').ondragleave = () => $('droparea').classList.remove('over');
        $('droparea').ondrop = event => {
            event.preventDefault();
            $('droparea').classList.remove('over');
            selectFile(event.dataTransfer.files[0]);
            updateUploadSummary()
        };
        $('upload-source').onchange = updateUploadSummary;
        $('btn-upload').onclick = upload;
        $('btn-upload-cancel').onclick = () => {
            state.file = null;
            $('document-file').value = '';
            $('selected-file').textContent = '点击选择，或将文件拖到这里';
            $('btn-upload').disabled = true;
            $('import-status').hidden = true;
            updateUploadSummary()
        };
        $('doc-filter').onchange = loadDocuments;
        $('confirm-cancel').onclick = $('confirm-close').onclick = () => {
            $('confirm-dialog').close();
            state.confirmAction = null
        };
        $('confirm-ok').onclick = () => {
            const action = state.confirmAction;
            state.confirmAction = null;
            $('confirm-dialog').close();
            if (action) action()
        };
        $('confirm-dialog').addEventListener('close', () => state.confirmAction = null);
        $('login-dialog').addEventListener('cancel', event => event.preventDefault());
        $('login-form').onsubmit = async event => {
            event.preventDefault();
            const button = event.submitter;
            button.disabled = true;
            try {
                await api('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: $('access-token').value})
                });
                $('access-token').value = '';
                $('login-error').textContent = '';
                $('login-dialog').close();
                await bootData()
            } catch (error) {
                $('login-error').textContent = error.message
            } finally {
                button.disabled = false
            }
        };
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeSidebar()
        });

        quickQuestions();
        (async () => {
            try {
                const auth = await api('/api/auth/status');
                if (auth.remote_disabled) {
                    setBanner('当前服务仅允许本机访问；远程使用需要管理员设置访问口令。');
                    $('input').placeholder = '当前仅允许本机访问';
                    $('btn-send').disabled = true;
                    toast('当前仅允许本机访问');
                    return
                }
                if (auth.required && !auth.authenticated) {
                    $('login-dialog').showModal();
                    return
                }
                await bootData()
            } catch (error) {
                toast(error.message);
                health()
            }
        })();
    })();
</script>
</body>
</html>
